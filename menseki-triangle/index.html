<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三角形面積シミュレーション</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; touch-action: none; font-family: sans-serif; }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            width: 90%;
            pointer-events: none;
        }
        
        button {
            background: white;
            border: 2px solid #333;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: auto;
        }
        button:active { background: #eee; transform: translateY(2px); }
        
        button.active {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        #grid-container {
            width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(#ccc 1px, transparent 1px),
                linear-gradient(90deg, #ccc 1px, transparent 1px);
            background-size: 50px 50px;
            touch-action: none;
        }
        
        svg { width: 100%; height: 100%; display: block; }
        
        .triangle { 
            fill: rgba(0, 150, 255, 0.5); 
            stroke: #0096ff; 
            stroke-width: 2; 
            pointer-events: none; 
        }

        /* アニメーション用パーツ */
        .anim-part {
            stroke-width: 2;
            pointer-events: none;
            transition: transform 1.0s ease-in-out;
            transform-box: view-box; 
        }
        
        .rotate-part-left { fill: rgba(255, 165, 0, 0.6); stroke: #ff8c00; }
        .rotate-part-right { fill: rgba(255, 100, 100, 0.6); stroke: #cc0000; }
        .base-part { fill: rgba(0, 150, 255, 0.5); stroke: #0096ff; }
        
        .vertex { 
            fill: red; 
            cursor: pointer; 
            touch-action: none;
            transition: opacity 0.3s;
        }

        /* 寸法線 */
        .measure-line { stroke: #333; stroke-width: 2; }
        .measure-line.height { stroke-dasharray: 5, 5; stroke: #d63384; }
        .measure-text {
            font-size: 24px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            paint-order: stroke;
            stroke: white;
            stroke-width: 4px;
        }
    </style>
</head>
<body>

<div id="controls">
    <button onclick="animateParallelogram()">形を変える①</button>
    <button onclick="animateRectangle()">形を変える②</button>
    <button id="btn-measure" onclick="toggleMeasurements()">高さと底辺を表示</button>
    <button onclick="resetShape()">リセット</button>
</div>

<div id="grid-container">
    <svg id="svg-area">
        <g id="animation-layer"></g>

        <g id="measure-layer" style="display: none;">
            <line id="height-line" class="measure-line height"></line>
            <line id="height-tick-top" class="measure-line height" style="display:none"></line>
            <line id="height-tick-bottom" class="measure-line height" style="display:none"></line>
            <text id="height-text" class="measure-text" fill="#d63384"></text>
            
            <line id="base-line" class="measure-line"></line>
            <line id="base-tick1" class="measure-line"></line>
            <line id="base-tick2" class="measure-line"></line>
            <text id="base-text" class="measure-text"></text>
        </g>

        <polygon id="main-triangle" points="250,650 450,650 350,450" class="triangle"></polygon>
        
        <circle cx="250" cy="650" r="20" class="vertex" id="p1"></circle>
        <circle cx="450" cy="650" r="20" class="vertex" id="p2"></circle>
        <circle cx="350" cy="450" r="20" class="vertex" id="p3"></circle>
    </svg>
</div>

<script>
    const svgArea = document.getElementById('svg-area');
    const triangle = document.getElementById('main-triangle');
    const animLayer = document.getElementById('animation-layer');
    const measureLayer = document.getElementById('measure-layer');
    
    // 寸法線
    const heightLine = document.getElementById('height-line');
    const heightTickTop = document.getElementById('height-tick-top');
    const heightTickBottom = document.getElementById('height-tick-bottom');
    const heightText = document.getElementById('height-text');
    const baseLine = document.getElementById('base-line');
    const baseTick1 = document.getElementById('base-tick1');
    const baseTick2 = document.getElementById('base-tick2');
    const baseText = document.getElementById('base-text');

    const vertices = [
        document.getElementById('p1'), // 左下
        document.getElementById('p2'), // 右下
        document.getElementById('p3')  // 上
    ];

    let isMeasureVisible = false;
    let currentMode = 'triangle'; 
    let isAnimating = false;

    // --- ドラッグ処理 ---
    const handlePointerDown = (e) => {
        if(isAnimating) return;
        resetShape(); 
        e.preventDefault();
        const vertex = e.target;
        vertex.setPointerCapture(e.pointerId);
        
        vertex.onpointermove = (moveEvent) => {
            const gridSize = 50;
            const rect = svgArea.getBoundingClientRect();
            const rawX = moveEvent.clientX - rect.left;
            const rawY = moveEvent.clientY - rect.top;
            const snappedX = Math.round(rawX / gridSize) * gridSize;
            const snappedY = Math.round(rawY / gridSize) * gridSize;

            // 底辺固定処理
            if (vertex.id === 'p3') {
                vertex.setAttribute('cx', snappedX);
                vertex.setAttribute('cy', snappedY);
            } else {
                vertex.setAttribute('cx', snappedX);
            }
            
            updateTriangle();
        };

        vertex.onpointerup = (upEvent) => {
            vertex.onpointermove = null;
            vertex.onpointerup = null;
            vertex.releasePointerCapture(upEvent.pointerId);
        };
    };
    vertices.forEach(v => v.addEventListener('pointerdown', handlePointerDown));

    function updateTriangle() {
        const pointsStr = vertices.map(v => `${v.getAttribute('cx')},${v.getAttribute('cy')}`).join(' ');
        triangle.setAttribute('points', pointsStr);
        triangle.style.display = 'block'; 
        vertices.forEach(v => v.style.opacity = '1');
        if (isMeasureVisible) updateMeasurements();
    }

    function toggleMeasurements() {
        isMeasureVisible = !isMeasureVisible;
        measureLayer.style.display = isMeasureVisible ? 'block' : 'none';
        document.getElementById('btn-measure').classList.toggle('active', isMeasureVisible);
        if (isMeasureVisible) updateMeasurements();
    }

    // 数値表示の更新関数（ここを修正しました）
    function updateMeasurements() {
        const p1 = { x: parseFloat(vertices[0].getAttribute('cx')), y: parseFloat(vertices[0].getAttribute('cy')) };
        const p2 = { x: parseFloat(vertices[1].getAttribute('cx')), y: parseFloat(vertices[1].getAttribute('cy')) };
        const p3 = { x: parseFloat(vertices[2].getAttribute('cx')), y: parseFloat(vertices[2].getAttribute('cy')) };
        const gridSize = 50;
        const minBaseX = Math.min(p1.x, p2.x);
        const maxBaseX = Math.max(p1.x, p2.x);
        const baseWidth = maxBaseX - minBaseX;
        
        // 【修正】小数第一位まで計算（整数なら整数で表示）
        const baseLengthCm = Math.round((baseWidth / gridSize) * 10) / 10;
        const baseOffsetY = p1.y + 40; 
        
        baseLine.setAttribute('x1', minBaseX); baseLine.setAttribute('y1', baseOffsetY);
        baseLine.setAttribute('x2', maxBaseX); baseLine.setAttribute('y2', baseOffsetY);
        baseTick1.setAttribute('x1', minBaseX); baseTick1.setAttribute('y1', baseOffsetY - 5);
        baseTick1.setAttribute('x2', minBaseX); baseTick1.setAttribute('y2', baseOffsetY + 5);
        baseTick2.setAttribute('x1', maxBaseX); baseTick2.setAttribute('y1', baseOffsetY - 5);
        baseTick2.setAttribute('x2', maxBaseX); baseTick2.setAttribute('y2', baseOffsetY + 5);
        baseText.textContent = `${baseLengthCm}`;
        baseText.setAttribute('x', (minBaseX + maxBaseX) / 2);
        baseText.setAttribute('y', baseOffsetY + 10);

        const baseY = p1.y; 
        if (currentMode === 'rectangle') {
            const fullHeightPx = Math.abs(baseY - p3.y);
            const halfHeightPx = fullHeightPx / 2;
            
            // 【修正】高さを半分にしたとき、小数対応する
            const halfHeightCm = Math.round((halfHeightPx / gridSize) * 10) / 10;
            
            const measureX = minBaseX - 30; 
            const topY = baseY - halfHeightPx;

            heightLine.setAttribute('x1', measureX); heightLine.setAttribute('y1', topY);
            heightLine.setAttribute('x2', measureX); heightLine.setAttribute('y2', baseY);
            heightTickTop.style.display = 'block';
            heightTickTop.setAttribute('x1', measureX - 5); heightTickTop.setAttribute('y1', topY);
            heightTickTop.setAttribute('x2', measureX + 5); heightTickTop.setAttribute('y2', topY);
            heightTickBottom.style.display = 'block';
            heightTickBottom.setAttribute('x1', measureX - 5); heightTickBottom.setAttribute('y1', baseY);
            heightTickBottom.setAttribute('x2', measureX + 5); heightTickBottom.setAttribute('y2', baseY);
            
            heightText.textContent = `${halfHeightCm}`;
            heightText.setAttribute('x', measureX - 20);
            heightText.setAttribute('y', (topY + baseY) / 2 + 5);
        } else {
            // 三角形モードの高さ
            const heightLengthCm = Math.round((Math.abs(baseY - p3.y) / gridSize) * 10) / 10;
            
            heightLine.setAttribute('x1', p3.x); heightLine.setAttribute('y1', p3.y);
            heightLine.setAttribute('x2', p3.x); heightLine.setAttribute('y2', baseY);
            heightTickTop.style.display = 'none';
            heightTickBottom.style.display = 'none';
            heightText.textContent = `${heightLengthCm}`;
            heightText.setAttribute('x', p3.x + 15);
            heightText.setAttribute('y', (p3.y + baseY) / 2 + 5);
        }
    }

    // --- 1. 形を変える① (平行四辺形) ---
    function animateParallelogram() {
        resetShape();
        currentMode = 'parallelogram';
        const p1 = { x: parseFloat(vertices[0].getAttribute('cx')), y: parseFloat(vertices[0].getAttribute('cy')) };
        const p2 = { x: parseFloat(vertices[1].getAttribute('cx')), y: parseFloat(vertices[1].getAttribute('cy')) };
        const p3 = { x: parseFloat(vertices[2].getAttribute('cx')), y: parseFloat(vertices[2].getAttribute('cy')) };
        const midX = (p2.x + p3.x) / 2;
        const midY = (p2.y + p3.y) / 2;
        const clone = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        clone.setAttribute("points", triangle.getAttribute("points"));
        clone.setAttribute("class", "anim-part");
        clone.style.fill = "rgba(255, 165, 0, 0.6)"; 
        clone.style.stroke = "#ff8c00";
        clone.style.transformOrigin = `${midX}px ${midY}px`;
        
        animLayer.appendChild(clone);
        setTimeout(() => { clone.style.transform = "rotate(180deg)"; }, 50);
        if (isMeasureVisible) updateMeasurements();
    }

    // --- 2. 形を変える② (長方形) ---
    function animateRectangle() {
        resetShape();
        currentMode = 'rectangle';
        isAnimating = true;

        const p1 = { x: parseFloat(vertices[0].getAttribute('cx')), y: parseFloat(vertices[0].getAttribute('cy')) };
        const p2 = { x: parseFloat(vertices[1].getAttribute('cx')), y: parseFloat(vertices[1].getAttribute('cy')) };
        const p3 = { x: parseFloat(vertices[2].getAttribute('cx')), y: parseFloat(vertices[2].getAttribute('cy')) };
        const minBaseX = Math.min(p1.x, p2.x);
        const maxBaseX = Math.max(p1.x, p2.x);

        if (p3.x < minBaseX || p3.x > maxBaseX) {
            runObtuseAnimation(p1, p2, p3, minBaseX, maxBaseX);
        } else {
            runAcuteAnimation(p1, p2, p3);
        }
    }

    function runAcuteAnimation(p1, p2, p3) {
        const midLx = (p1.x + p3.x) / 2; const midLy = (p1.y + p3.y) / 2;
        const midRx = (p2.x + p3.x) / 2; const midRy = (p2.y + p3.y) / 2;
        const cutY = midLy;
        const p3VerticalX = p3.x; 

        const trapezoid = createPoly(`${p1.x},${p1.y} ${p2.x},${p2.y} ${midRx},${midRy} ${midLx},${midLy}`, "base-part");
        const leftTri = createPoly(`${midLx},${midLy} ${p3.x},${p3.y} ${p3VerticalX},${cutY}`, "rotate-part-left");
        leftTri.style.transformOrigin = `${midLx}px ${midLy}px`;
        const rightTri = createPoly(`${p3VerticalX},${cutY} ${p3.x},${p3.y} ${midRx},${midRy}`, "rotate-part-right");
        rightTri.style.transformOrigin = `${midRx}px ${midRy}px`;

        animLayer.append(trapezoid, leftTri, rightTri);
        triangle.style.display = 'none';
        vertices.forEach(v => v.style.opacity = '0');

        setTimeout(() => {
            leftTri.style.transform = "rotate(-180deg)"; 
            rightTri.style.transform = "rotate(180deg)";
            isAnimating = false;
        }, 50);

        if (isMeasureVisible) updateMeasurements();
    }

    function runObtuseAnimation(p1, p2, p3, minBaseX, maxBaseX) {
        const isRightLeaning = p3.x > maxBaseX;
        const midY = (p1.y + p3.y) / 2;
        
        let pivotX, pivotY;
        if (isRightLeaning) {
            pivotX = (p2.x + p3.x) / 2; pivotY = (p2.y + p3.y) / 2;
        } else {
            pivotX = (p1.x + p3.x) / 2; pivotY = (p1.y + p3.y) / 2;
        }

        const midL = {x: (p1.x+p3.x)/2, y: midY};
        const midR = {x: (p2.x+p3.x)/2, y: midY};
        
        const basePart = createPoly(`${p1.x},${p1.y} ${p2.x},${p2.y} ${midR.x},${midR.y} ${midL.x},${midL.y}`, "base-part");
        const topTri = createPoly(`${midL.x},${midL.y} ${p3.x},${p3.y} ${midR.x},${midR.y}`, "rotate-part-left");
        topTri.style.transformOrigin = `${pivotX}px ${pivotY}px`;

        animLayer.append(basePart, topTri);
        triangle.style.display = 'none';
        vertices.forEach(v => v.style.opacity = '0');

        setTimeout(() => {
            topTri.style.transform = "rotate(180deg)";
            
            setTimeout(() => {
                const slideDistance = maxBaseX - minBaseX;
                const slideX = isRightLeaning ? -slideDistance : slideDistance;
                
                topTri.style.transition = "transform 1.5s ease-in-out";
                topTri.style.transform = `translate(${slideX}px, 0px) rotate(180deg)`;

                setTimeout(() => {
                    isAnimating = false;
                    if (isMeasureVisible) updateMeasurements();
                }, 1500);

            }, 1000); 

        }, 50);

        if (isMeasureVisible) updateMeasurements();
    }

    function createPoly(points, className) {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        p.setAttribute("points", points);
        p.setAttribute("class", "anim-part " + className);
        return p;
    }

    function resetShape() {
        currentMode = 'triangle';
        isAnimating = false;
        animLayer.innerHTML = '';
        triangle.style.display = 'block';
        vertices.forEach(v => v.style.opacity = '1');
        if (isMeasureVisible) updateMeasurements();
    }
</script>

</body>
</html>
