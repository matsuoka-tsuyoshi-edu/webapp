<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ストップウォッチ</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* 画面全体の基本設定 */
        html, body {
            height: 100%; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }
        body {
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
        }

        /* 文字色のフラッシュアニメーション */
        @keyframes flashRed {
            0% { color: #ff3b30; } 
            100% { color: white; }
        }
        .flash-effect {
            animation: flashRed 0.4s ease-out;
        }

        /* --- タイマー表示エリア --- */
        #timer-container {
            flex: 1; 
            display: flex;
            align-items: baseline; 
            justify-content: center;
            width: 100%;
            flex-direction: row;
            padding-top: 15vh;
            box-sizing: border-box;
            line-height: 0.9;
            transition: color 0.1s;
        }

        /* 共通の大文字スタイル */
        .large-text {
            font-size: 34vw; 
            font-weight: 600;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }
        
        #colon {
            position: relative;
            top: -2vw;
            margin: 0 -1vw;
        }

        #seconds-wrapper {
            display: flex;
            flex-direction: column; 
            align-items: flex-end; 
        }

        #sub-time {
            font-size: 11vw;
            font-weight: 500;
            color: #8e8e93; 
            margin-top: 1vh;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
            margin-right: 1.5vw; 
        }

        /* --- コントロールエリア（リセットボタン） --- */
        #controls {
            height: 20vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        /* リセットボタンのスタイル（円形に変更） */
        #reset-btn {
            background: transparent;
            border: 2px solid #333; /* 枠線を少し太くして視認性アップ */
            color: #8e8e93;
            
            font-size: 16px; /* 文字サイズはそのまま */
            
            /* ここで正円を作る */
            width: 80px;
            height: 80px;
            border-radius: 50%;
            
            /* 文字を中央揃え */
            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            transition: all 0.2s ease;
            
            letter-spacing: 0.5px;
        }

        /* ボタンが押せるとき（停止中・カウントあり） */
        #reset-btn.active {
            border-color: #8e8e93; /* 枠線を明るく */
            color: white;
            background-color: #1c1c1e; /* 中身も少し明るく */
        }
        
        /* ボタンタップ時の沈み込み */
        #reset-btn.active:active {
            transform: scale(0.92);
            background-color: #333;
        }

        /* ボタン無効時（計測中） */
        #reset-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
            border-color: #333;
        }

    </style>
</head>
<body>

    <div id="timer-container">
        <div id="minutes" class="large-text">00</div>
        <div id="colon" class="large-text">:</div>
        <div id="seconds-wrapper">
            <div id="seconds" class="large-text">00</div>
            <div id="sub-time">00</div>
        </div>
    </div>

    <div id="controls">
        <div id="reset-btn" class="disabled">RESET</div>
    </div>

    <script>
        // --- DOM要素 ---
        const container = document.getElementById('timer-container');
        const minutesEl = document.getElementById('minutes');
        const colonEl = document.getElementById('colon');
        const secondsEl = document.getElementById('seconds');
        const subTimeEl = document.getElementById('sub-time');
        const resetBtn = document.getElementById('reset-btn');
        
        // --- 変数 ---
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        
        // --- 初期設定 ---
        updateDisplay(0);
        updateResetButtonState(); 

        // --- イベント設定 ---

        // 1. メイン操作
        [minutesEl, colonEl, secondsEl].forEach(el => {
            addSmartTapListener(el, 
                () => toggleTimer(),
                () => { if (!isRunning) resetTimer(); }
            );
        });

        // 2. コンマ秒
        addSmartTapListener(subTimeEl,
            () => { },
            () => { if (!isRunning) resetTimer(); }
        );

        // 3. リセットボタン
        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!isRunning && elapsedTime > 0) {
                resetTimer();
            }
        });

        // --- スマートタップ判定関数 ---
        function addSmartTapListener(element, onSingleTap, onDoubleTap) {
            let tapCount = 0;
            let tapTimeout = null;

            element.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();

                tapCount++;

                if (tapCount === 1) {
                    tapTimeout = setTimeout(() => {
                        onSingleTap();
                        tapCount = 0;
                    }, 250); 
                } else {
                    clearTimeout(tapTimeout);
                    onDoubleTap();
                    tapCount = 0;
                }
            });
        }

        // --- タイマー機能 ---
        function toggleTimer() {
            triggerFlash(); 
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startTime = Date.now() - elapsedTime;
            
            updateResetButtonState(); 

            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateDisplay(elapsedTime);
            }, 10);
        }

        function stopTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            
            updateResetButtonState(); 
        }

        function resetTimer() {
            if (isRunning) return;
            elapsedTime = 0;
            updateDisplay(0);
            updateResetButtonState(); 
        }

        // リセットボタンの見た目を制御
        function updateResetButtonState() {
            if (isRunning) {
                resetBtn.classList.add('disabled');
                resetBtn.classList.remove('active');
            } else {
                resetBtn.classList.remove('disabled');
                if (elapsedTime > 0) {
                    resetBtn.classList.add('active');
                } else {
                    resetBtn.classList.remove('active');
                }
            }
        }

        function updateDisplay(timeMs) {
            const m = Math.floor(timeMs / 60000);
            const s = Math.floor((timeMs % 60000) / 1000);
            const ms = Math.floor((timeMs % 1000) / 10); 

            minutesEl.textContent = String(m).padStart(2, '0');
            secondsEl.textContent = String(s).padStart(2, '0');
            subTimeEl.textContent = String(ms).padStart(2, '0');
        }

        // --- 視覚エフェクト ---
        function triggerFlash() {
            container.classList.remove('flash-effect');
            void container.offsetWidth; 
            container.classList.add('flash-effect');

            subTimeEl.style.color = 'inherit';
            setTimeout(() => {
                subTimeEl.style.color = ''; 
            }, 400);
        }

    </script>
</body>
</html>
