<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- PWA / 全画面対応 (Chrome / Android / iOS Safari) -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ずけいノート">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>ずけいノート - 算数・数学ノート</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <!-- 全画面方眼紙SVGキャンバス -->
  <div id="canvas-wrap">
    <svg id="board-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid-minor-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid-minor)" stroke-width="1"/>
        </pattern>
        <pattern id="grid-major-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
          <rect width="200" height="200" fill="url(#grid-minor-pattern)"/>
          <path d="M 200 0 L 0 0 0 200" fill="none" stroke="var(--grid-major)" stroke-width="1.6"/>
        </pattern>
        <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="context-stroke"/>
        </marker>
        <clipPath id="loupe-clip">
          <circle id="loupe-clip-circle" cx="0" cy="0" r="72"/>
        </clipPath>
      </defs>

      <g id="viewport-group">
        <g id="world-root">
          <g id="bg-image-layer"></g>
          <rect id="grid-bg-rect" x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid-major-pattern)" opacity="0.92"/>
          <line class="grid-origin-line" x1="-10000" y1="0" x2="10000" y2="0" stroke="var(--grid-origin)" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>
          <line class="grid-origin-line" x1="0" y1="-10000" x2="0" y2="10000" stroke="var(--grid-origin)" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>
          <g id="objects-layer"></g>
          <g id="preview-layer"></g>
          <g id="overlay-layer"></g>
        </g>
      </g>

      <!-- ドラッグ時拡大虫眼鏡（ルーペ）レイヤー -->
      <g id="loupe-layer" style="display:none; pointer-events:none;">
        <circle id="loupe-shadow" cx="0" cy="0" r="74" fill="rgba(15, 23, 42, 0.22)"/>
        <g clip-path="url(#loupe-clip)">
          <rect id="loupe-bg" x="-100" y="-100" width="200" height="200" fill="var(--bg-canvas)"/>
          <use id="loupe-use" href="#world-root"/>
        </g>
        <line id="loupe-cross-h" x1="-14" y1="0" x2="14" y2="0" stroke="#ef4444" stroke-width="1.5" opacity="0.85"/>
        <line id="loupe-cross-v" x1="0" y1="-14" x2="0" y2="14" stroke="#ef4444" stroke-width="1.5" opacity="0.85"/>
        <circle id="loupe-center-dot" cx="0" cy="0" r="2.2" fill="#ef4444"/>
        <circle id="loupe-ring" cx="0" cy="0" r="72" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
      </g>
    </svg>
  </div>

  <!-- 右上常駐コントロール（全画面 ＋ 発表モード） -->
  <div id="top-right-controls">
    <button id="btn-fullscreen" class="top-pill-btn" type="button" title="全画面表示" aria-label="全画面表示">
      <span>⛶</span><span data-i18n="fullscreen">全画面</span>
    </button>
    <button id="btn-toggle-ui" class="top-pill-btn" type="button" title="発表モード（メニュー・ツールを隠す/表示）" aria-label="ツール表示切替">
      <span class="ui-toggle-icon">📺</span>
      <span id="ui-toggle-label" data-i18n="hide_ui">かくす</span>
    </button>
  </div>

  <!-- 左側 縦1列統合ドック -->
  <aside id="left-dock-wrap" aria-label="ツールとメニュー">
    <nav id="main-rail" class="floating-rail" aria-label="統合ツールバー">
      <button id="btn-collapse-main" class="rail-collapse-btn" type="button" title="バーをたたむ" aria-label="バーをたたむ">◀</button>
      <div class="rail-scroll">
        <!-- 戻る・やり直し（省スペース2分割） -->
        <div class="rail-pair-row">
          <button id="btn-undo" class="rail-mini-btn" type="button" title="もどす" aria-label="もどす">↩</button>
          <button id="btn-redo" class="rail-mini-btn" type="button" title="やりなおす" aria-label="やりなおす">↪</button>
        </div>

        <!-- 選択・画面移動（長押し切替） -->
        <button id="tool-btn-pointer" class="tool-btn has-sub active" data-tool="select" data-menu="menu-pointer" type="button" title="選択・移動（長押しで画面移動）">
          <span class="tool-icon" id="pointer-tool-icon">👆</span>
          <span class="tool-label" id="pointer-tool-label" data-i18n="tool_select">選択</span>
        </button>

        <!-- 線・点（デフォルト線・長押しで点と線種） -->
        <button id="tool-btn-line" class="tool-btn has-sub" data-tool="line" data-menu="menu-line" type="button" title="線（長押しで点・線の種類）">
          <span class="tool-icon" id="line-tool-icon">📏</span>
          <span class="tool-label" id="line-tool-label" data-i18n="tool_line">線</span>
        </button>

        <!-- 図形（短押しで三角形・長押しで四角形/正多角形） -->
        <button id="tool-btn-shape" class="tool-btn has-sub" data-tool="shape" data-menu="menu-shapes" type="button" title="図形（短押しで三角形 / 長押しで四角形・正多角形）">
          <span class="tool-icon" id="shape-tool-icon">△</span>
          <span class="tool-label" data-i18n="tool_shape">図形</span>
        </button>

        <!-- 円 -->
        <button class="tool-btn has-sub" data-tool="circle" data-menu="menu-circle" type="button" title="円（正円・楕円）">
          <span class="tool-icon">◯</span>
          <span class="tool-label" data-i18n="tool_circle">円</span>
        </button>

        <!-- コンパス -->
        <button class="tool-btn compass-btn" data-tool="compass" type="button" title="コンパス">
          <span class="tool-icon">🧭</span>
          <span class="tool-label" data-i18n="tool_compass">コンパス</span>
        </button>

        <!-- 角度（角をタップして1〜3重円弧＋内側塗り） -->
        <button id="tool-btn-angle" class="tool-btn" data-tool="angle" type="button" title="角度マーク（角をタップ）">
          <span class="tool-icon">📐</span>
          <span class="tool-label" data-i18n="angles">角度</span>
        </button>

        <!-- 辺記号（平行・同じ長さマーク 1〜3本） -->
        <button id="tool-btn-mark" class="tool-btn has-sub" data-tool="edge_mark" data-menu="menu-edge-mark" type="button" title="平行・同じ長さの記号">
          <span class="tool-icon" id="mark-tool-icon">∥</span>
          <span class="tool-label" data-i18n="tool_edge_mark">記号</span>
        </button>

        <!-- 文字（手書き認識・タイプ字変換） -->
        <button id="tool-btn-text" class="tool-btn" data-tool="text" type="button" title="文字（場所をタップ→手書きで自動変換）">
          <span class="tool-icon">🔤</span>
          <span class="tool-label" data-i18n="tool_text">文字</span>
        </button>

        <!-- 消去・全消去（デフォルト消去・長押しで全消去） -->
        <button id="tool-btn-eraser" class="tool-btn has-sub eraser-btn" data-tool="eraser" data-menu="menu-eraser" type="button" title="消去（長押しで全消去）">
          <span class="tool-icon">🧹</span>
          <span class="tool-label" data-i18n="tool_eraser">消去</span>
        </button>

        <div class="rail-sep"></div>

        <!-- 色（■） -->
        <button id="btn-color" class="rail-btn" type="button" title="色・塗りつぶし">
          <span id="current-color-dot" class="icon-square" style="background:#111827"></span>
          <span class="rail-label" data-i18n="color">いろ</span>
        </button>

        <!-- 線幅・線種 -->
        <button id="btn-width" class="rail-btn" type="button" title="線の太さと種類">
          <span id="current-width-bar" class="width-line-preview" style="height:2px"></span>
          <span class="rail-label" data-i18n="width">線幅・種</span>
        </button>

        <!-- スナップ -->
        <button id="btn-snap" class="rail-btn active" type="button" title="方眼スナップ">
          <span class="rail-icon">🧲</span>
          <span class="rail-label" data-i18n="snap">スナップ</span>
        </button>

        <!-- 切断 -->
        <button id="btn-scissors" class="rail-btn" type="button" title="はさみで切断">
          <span class="rail-icon">✂️</span>
          <span class="rail-label" data-i18n="scissors">切断</span>
        </button>

        <!-- 設定・保存 -->
        <button id="btn-menu" class="rail-btn" type="button" title="設定・保存">
          <span class="rail-icon">⚙</span>
          <span class="rail-label" data-i18n="menu">せってい</span>
        </button>
      </div>
    </nav>

    <!-- 折りたたみ時タブ -->
    <button id="tab-expand-main" class="rail-expand-tab" type="button" title="バーをひらく">▶<br>ﾂｰﾙ</button>
  </aside>

  <!-- 左上寄せの状況表示バー（選択中・グループ化・クリップボード） -->
  <div id="multi-bar">
    <span id="multi-count-badge" class="tf-badge">選択中</span>
    <button id="btn-multi-add" class="ui-btn" type="button">➕ <span data-i18n="multi_add">複数</span></button>
    <button id="btn-multi-group" class="ui-btn" type="button">🔗 <span data-i18n="multi_group">グループ化</span></button>
    <button id="btn-multi-ungroup" class="ui-btn" type="button">🔓 <span data-i18n="multi_ungroup">グループ解除</span></button>
    <button id="btn-multi-cut" class="ui-btn" type="button">✂ <span data-i18n="multi_cut">カット</span></button>
    <button id="btn-multi-copy" class="ui-btn" type="button">📋 <span data-i18n="multi_copy">コピー</span></button>
    <button id="btn-multi-paste" class="ui-btn" type="button">📌 <span data-i18n="multi_paste">貼り付け</span></button>
    <button id="btn-multi-delete" class="ui-btn danger-text" type="button">🗑 <span data-i18n="multi_delete">削除</span></button>
    <button id="btn-multi-clear" class="ui-btn" type="button">✖ <span data-i18n="multi_clear">解除</span></button>
  </div>

  <!-- 左上寄せ：文字（手書き変換）モードバー -->
  <div id="text-bar">
    <span class="tf-badge" id="text-status-badge">🔤 置く場所をタップ</span>
    <button id="btn-text-hw-mode" class="ui-btn" type="button"><span id="text-hw-mode-label" data-i18n="text_hw_all">すべて</span></button>
    <div id="text-candidates" class="cand-row"></div>
    <button id="btn-text-commit" class="ui-btn active" type="button" style="display:none;">✔ <span data-i18n="tf_done">確定</span></button>
    <button id="btn-text-hw-clear" class="ui-btn" type="button" style="display:none;">↺ 書き直し</button>
    <button id="btn-text-keyboard" class="ui-btn" type="button">⌨ <span data-i18n="text_keyboard">直接入力</span></button>
    <button id="btn-text-done" class="ui-btn" type="button">✖ <span data-i18n="multi_clear">閉じる</span></button>
  </div>

  <!-- 左上寄せ：角度モードバー -->
  <div id="angle-bar">
    <span class="tf-badge">📐 <span data-i18n="angles">角度</span></span>
    <button id="btn-angle-fill" class="ui-btn" type="button">🎨 <span data-i18n="angle_fill">内側を塗る</span>: <strong id="angle-fill-text">OFF</strong></button>
    <button id="btn-angle-done" class="ui-btn active" type="button">✔ <span data-i18n="tf_done">完了</span></button>
  </div>

  <!-- 左上寄せ：記号（平行・同じ長さ）モードバー -->
  <div id="mark-bar">
    <span class="tf-badge">∥ <span data-i18n="tool_edge_mark">記号</span></span>
    <button class="ui-btn active" data-mark-mode="parallel" type="button">▸ <span data-i18n="mark_parallel">平行</span></button>
    <button class="ui-btn" data-mark-mode="equal" type="button">╂ <span data-i18n="mark_equal">同じ長さ</span></button>
    <button id="btn-mark-done" class="ui-btn active" type="button">✔ <span data-i18n="tf_done">完了</span></button>
  </div>

  <!-- 左上寄せの長押し変形フローティングメニュー -->
  <div id="transform-bar">
    <span class="tf-badge" data-i18n="tf_title">頂点をドラッグして変形</span>
    <button class="ui-btn active" data-tf="both" type="button">🔄 <span data-i18n="tf_both">回転・拡大縮小</span></button>
    <button class="ui-btn" data-tf="rotate" type="button">↻ <span data-i18n="tf_rotate">回転のみ</span></button>
    <button class="ui-btn" data-tf="scale" type="button">⤢ <span data-i18n="tf_scale">拡大・縮小</span></button>
    <button class="ui-btn" data-tf="vertex" type="button">✦ <span data-i18n="tf_vertex">頂点編集</span></button>
    <button id="btn-tf-clone" class="ui-btn" type="button">📋 <span data-i18n="tf_clone">複製</span></button>
    <button id="btn-tf-flip" class="ui-btn" type="button">⇄ <span data-i18n="tf_flip">反転</span></button>
    <button id="btn-tf-delete" class="ui-btn danger-text" type="button">🗑 <span data-i18n="tf_delete">削除</span></button>
    <button id="btn-tf-done" class="ui-btn active" type="button">✔ <span data-i18n="tf_done">完了</span></button>
  </div>

  <!-- 右下横並びズームコントロール -->
  <div id="zoom-controls">
    <button id="btn-zoom-out" class="zoom-pill" type="button" aria-label="縮小">－</button>
    <button id="btn-zoom-reset" class="zoom-pill zoom-pct" type="button">100%</button>
    <button id="btn-zoom-in" class="zoom-pill" type="button" aria-label="拡大">＋</button>
  </div>

  <!-- 背景画像ミニ設定パネル -->
  <div id="bg-controls">
    <label><span data-i18n="bg_opacity">画像の濃さ</span><input id="bg-opacity-range" type="range" min="10" max="100" value="65"></label>
    <label><span data-i18n="bg_scale">画像サイズ</span><input id="bg-scale-range" type="range" min="25" max="300" value="100"></label>
  </div>

  <!-- サブメニュー：選択・画面移動 -->
  <div id="menu-pointer" class="popover-menu">
    <button class="pop-item selected" data-pointer-mode="select" type="button">👆 <span data-i18n="tool_select">選択・移動</span></button>
    <button class="pop-item" data-pointer-mode="pan" type="button">✋ <span data-i18n="tool_pan">画面移動</span></button>
  </div>

  <!-- サブメニュー：線・点統合（デフォルト線 / 長押しで点も選択） -->
  <div id="menu-line" class="popover-menu">
    <div class="pop-title" data-i18n="tool_line">線</div>
    <button class="pop-item selected" data-tool="line" data-sub="line_segment" type="button">╱ <span data-i18n="line_segment">直線</span></button>
    <button class="pop-item" data-tool="line" data-sub="line_freehand" type="button">〰 <span data-i18n="line_freehand">自由線</span></button>
    <button class="pop-item" data-tool="line" data-sub="line_arrow" type="button">↗ <span data-i18n="line_arrow">矢印</span></button>
    <div id="line-point-extra">
      <div class="pop-sep"></div>
      <button class="pop-item" data-tool="point" type="button">● <span data-i18n="tool_point">点</span></button>
    </div>
  </div>

  <!-- サブメニュー：図形統合（三角形 / 長押しで四角形・正多角形も展開） -->
  <div id="menu-shapes" class="popover-menu" style="min-width:225px;">
    <div class="pop-title" data-i18n="tool_triangle">三角形</div>
    <button class="pop-item" data-tool="place" data-sub="tri_general" data-icon="◹" type="button">◹ <span data-i18n="tri_general">一般三角形</span></button>
    <button class="pop-item" data-tool="place" data-sub="tri_isosceles" data-icon="△" type="button">△ <span data-i18n="tri_isosceles">二等辺三角形</span></button>
    <button class="pop-item" data-tool="place" data-sub="tri_equilateral" data-icon="▲" type="button">▲ <span data-i18n="tri_equilateral">正三角形</span></button>
    <button class="pop-item" data-tool="place" data-sub="tri_right" data-icon="⊿" type="button">⊿ <span data-i18n="tri_right">直角三角形</span></button>
    <div id="shapes-extra-group">
      <div class="pop-sep"></div>
      <div class="pop-title" data-i18n="tool_quad">四角形</div>
      <button class="pop-item" data-tool="place" data-sub="quad_square" data-icon="■" type="button">■ <span data-i18n="quad_square">正方形</span></button>
      <button class="pop-item" data-tool="place" data-sub="quad_rect" data-icon="▭" type="button">▭ <span data-i18n="quad_rect">長方形</span></button>
      <button class="pop-item" data-tool="place" data-sub="quad_para" data-icon="▱" type="button">▱ <span data-i18n="quad_para">平行四辺形</span></button>
      <button class="pop-item" data-tool="place" data-sub="quad_trap" data-icon="⏢" type="button">⏢ <span data-i18n="quad_trap">台形</span></button>
      <button class="pop-item" data-tool="place" data-sub="quad_rhombus" data-icon="◇" type="button">◇ <span data-i18n="quad_rhombus">ひし形</span></button>
      <div class="pop-sep"></div>
      <div class="pop-title" data-i18n="tool_poly">正多角形</div>
      <button class="pop-item" data-tool="place" data-sub="poly_pentagon" data-icon="⬠" type="button">⬠ <span data-i18n="poly_pentagon">正五角形</span></button>
      <button class="pop-item" data-tool="place" data-sub="poly_hexagon" data-icon="⬡" type="button">⬡ <span data-i18n="poly_hexagon">正六角形</span></button>
      <button class="pop-item" data-tool="place" data-sub="poly_octagon" data-icon="🛑" type="button">🛑 <span data-i18n="poly_octagon">正八角形</span></button>
    </div>
  </div>

  <!-- サブメニュー：円 -->
  <div id="menu-circle" class="popover-menu">
    <button class="pop-item" data-tool="place" data-sub="circle_regular" type="button">◯ <span data-i18n="circle_regular">正円</span></button>
    <button class="pop-item" data-tool="place" data-sub="circle_ellipse" type="button">⬭ <span data-i18n="circle_ellipse">楕円</span></button>
  </div>

  <!-- サブメニュー：辺の記号 -->
  <div id="menu-edge-mark" class="popover-menu">
    <div class="pop-title" data-i18n="tool_edge_mark">記号</div>
    <button class="pop-item selected" data-mark-pick="parallel" type="button">▸ <span data-i18n="mark_parallel">平行マーク (1〜3本)</span></button>
    <button class="pop-item" data-mark-pick="equal" type="button">╂ <span data-i18n="mark_equal">同じ長さ (1〜3本)</span></button>
  </div>

  <!-- サブメニュー：消去・全消去 -->
  <div id="menu-eraser" class="popover-menu">
    <button class="pop-item selected" data-eraser-mode="eraser" type="button">🧹 <span data-i18n="tool_eraser">消去（タップで消す）</span></button>
    <button class="pop-item danger-text" data-eraser-mode="clear_all" type="button">🗑 <span data-i18n="clear">全消去</span></button>
  </div>

  <!-- 色メニュー -->
  <div id="menu-color" class="popover-menu">
    <div class="pop-title" data-i18n="color">色</div>
    <div id="swatch-grid" class="swatch-grid"></div>
    <div class="pop-sep"></div>
    <button id="btn-toggle-fill" class="pop-item selected" type="button">🎨 <span data-i18n="fill_label">中をぬる</span>: <strong id="fill-state-text">ON</strong></button>
  </div>

  <!-- 線幅・線種メニュー -->
  <div id="menu-width" class="popover-menu" style="min-width:220px;">
    <div class="pop-title" data-i18n="line_style_title">線の種類</div>
    <div id="line-style-list" class="line-style-grid">
      <button class="pop-item selected" data-line-style="solid" type="button">━ <span data-i18n="line_solid">実線</span></button>
      <button class="pop-item" data-line-style="dashed" type="button">┈ <span data-i18n="line_dashed">点線</span></button>
      <button class="pop-item" data-line-style="double" type="button">═ <span data-i18n="line_double">二重線</span></button>
    </div>
    <div class="pop-sep"></div>
    <div class="pop-title" data-i18n="width">太さ</div>
    <div id="width-list"></div>
  </div>

  <!-- 設定・保存メニュー -->
  <div id="menu-settings" class="popover-menu" style="min-width:255px;">
    <div class="pop-title" data-i18n="menu_age">表示用語のレベル</div>
