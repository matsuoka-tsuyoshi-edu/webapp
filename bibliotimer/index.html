<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ビブリオバトル・タイマー</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260526_4">
</head>
<body>
    <!-- Orientation Warning Screen for Portrait mode on iPad/Tablets -->
    <div id="orientation-warning" class="orientation-warning">
        <div class="warning-content">
            <svg class="warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                <path d="M12 18h.01" />
                <path class="arrow-rotate" d="M17 9l4-4-4-4M21 5H9a5 5 0 0 0-5 5v2" />
            </svg>
            <p class="warning-text">画面を横向き（ランドスケープ）にしてください</p>
            <p class="warning-subtext">ビブリオバトル・タイマーは横画面での使用に最適化されています。</p>
        </div>
    </div>

    <!-- Floating Settings Button (Top Right) -->
    <button id="settings-toggle" class="icon-btn" aria-label="設定を開く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <!-- Main Container -->
    <main class="app-container">
        <!-- Status Badge (Optional top label for current mode) -->
        <div id="mode-badge" class="mode-badge">発表</div>

        <!-- Timer Display Area -->
        <div id="timer-display-container">
            <div id="timer-display" class="timer-color-normal">
                <span id="time-main">05:00</span><span id="time-separator">&nbsp;</span><span id="time-sub">00</span>
            </div>
        </div>

        <!-- Controls Area (Bottom Center) -->
        <div class="controls-container">
            <button id="reset-btn" class="glass-btn secondary-btn" aria-label="リセット">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
                <span>リセット</span>
            </button>
            
            <button id="start-stop-btn" class="glass-btn primary-btn" aria-label="スタート">
                <span class="btn-content play-content">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="btn-icon">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>スタート</span>
                </span>
                <span class="btn-content pause-content hidden">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="btn-icon">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                    <span>一時停止</span>
                </span>
            </button>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <h2>タイマーの設定</h2>
                <button id="settings-close" class="close-btn" aria-label="閉じる">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Phase Time Settings (Individual Customization) -->
                <div class="setting-group">
                    <label class="setting-label">各フェーズの時間設定</label>
                    <div class="phase-time-inputs" style="display: flex; flex-direction: column; gap: 0.8rem;">
                        <!-- Presentation Time -->
                        <div class="phase-time-row" style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); padding: 0.8rem 1.2rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                            <span class="setting-label" style="margin-bottom: 0; font-size: 1.05rem;">① 発表の時間</span>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <div class="input-field">
                                    <select id="time-pres-min" style="width: 80px; height: 44px; font-size: 1.1rem; border-radius: 10px; border: 2px solid var(--glass-border); text-align: center; font-weight: 700; background: var(--bg-primary); color: var(--text-normal); cursor: pointer; padding-left: 0.5rem;"></select>
                                    <span>分</span>
                                </div>
                                <div class="input-field">
                                    <select id="time-pres-sec" style="width: 80px; height: 44px; font-size: 1.1rem; border-radius: 10px; border: 2px solid var(--glass-border); text-align: center; font-weight: 700; background: var(--bg-primary); color: var(--text-normal); cursor: pointer; padding-left: 0.5rem;"></select>
                                    <span>秒</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Discussion Time -->
                        <div class="phase-time-row" style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); padding: 0.8rem 1.2rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                            <span class="setting-label" style="margin-bottom: 0; font-size: 1.05rem;">② ディスカッションの時間</span>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <div class="input-field">
                                    <select id="time-disc-min" style="width: 80px; height: 44px; font-size: 1.1rem; border-radius: 10px; border: 2px solid var(--glass-border); text-align: center; font-weight: 700; background: var(--bg-primary); color: var(--text-normal); cursor: pointer; padding-left: 0.5rem;"></select>
                                    <span>分</span>
                                </div>
                                <div class="input-field">
                                    <select id="time-disc-sec" style="width: 80px; height: 44px; font-size: 1.1rem; border-radius: 10px; border: 2px solid var(--glass-border); text-align: center; font-weight: 700; background: var(--bg-primary); color: var(--text-normal); cursor: pointer; padding-left: 0.5rem;"></select>
                                    <span>秒</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Transition Time -->
                        <div class="phase-time-row" style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); padding: 0.8rem 1.2rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                            <span class="setting-label" style="margin-bottom: 0; font-size: 1.05rem;">③ 移動準備の時間</span>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <div class="input-field">
                                    <select id="time-tran-min" style="width: 80px; height: 44px; font-size: 1.1rem; border-radius: 10px; border: 2px solid var(--glass-border); text-align: center; font-weight: 700; background: var(--bg-primary); color: var(--text-normal); cursor: pointer; padding-left: 0.5rem;"></select>
                                    <span>分</span>
                                </div>
                                <div class="input-field">
                                    <select id="time-tran-sec" style="width: 80px; height: 44px; font-size: 1.1rem; border-radius: 10px; border: 2px solid var(--glass-border); text-align: center; font-weight: 700; background: var(--bg-primary); color: var(--text-normal); cursor: pointer; padding-left: 0.5rem;"></select>
                                    <span>秒</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bell Sound Settings -->
                <div class="setting-group">
                    <label class="setting-label">終了ベル・効果音</label>
                    <div class="bell-settings" style="margin-bottom: 0.8rem;">
                        <label class="checkbox-label">
                            <input type="checkbox" id="bell-enabled" checked>
                            <span>効果音を鳴らす</span>
                        </label>
                        <button id="sound-test-btn" class="test-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                                <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                            試聴する
                        </button>
                    </div>
                    <!-- Sound Type Options -->
                    <div id="sound-type-container" class="toggle-options" style="margin-top: 0.8rem; border-top: 1px dashed var(--glass-border); padding-top: 0.8rem;">
                        <span class="setting-label" style="font-size: 0.95rem; margin-bottom: 0.4rem;">音色の種類</span>
                        <label class="toggle-option">
                            <input type="radio" name="sound-type" value="bell-standard" checked>
                            <span>標準のベル (チーン)</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="sound-type" value="bell-high">
                            <span>高めのベル (フロントベル風)</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="sound-type" value="buzzer">
                            <span>ブザー (プー)</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="sound-type" value="horn">
                            <span>アリーナホーン (ブォー)</span>
                        </label>
                    </div>
                    <p class="setting-tip" style="margin-top: 0.8rem;">※ 残り1分で1回、終了時に3回、選択した効果音が鳴ります。</p>
                </div>

                <!-- Bibliobattle Flow Settings -->
                <div class="setting-group">
                    <label class="setting-label">進行モード（連続自動遷移）</label>
                    <div class="toggle-options">
                        <label class="toggle-option">
                            <input type="radio" name="auto-baton" value="off">
                            <span>なし（通常の単発タイマー）</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="auto-baton" value="manual">
                            <span>マニュアル連続（自動フェーズ切り替え＋手動スタート）</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="auto-baton" value="auto" checked>
                            <span>オート連続（全自動切り替え＋自動スタート）</span>
                        </label>
                    </div>
                    <p class="setting-tip">※ 発表(5分) ➔ ディスカッション(3分) ➔ 移動準備(15秒) の順に自動で切り替わります。</p>
                </div>

                <!-- Theme (White by default, with option for dark) -->
                <div class="setting-group">
                    <label class="setting-label">テーマ</label>
                    <div class="toggle-options">
                        <label class="toggle-option">
                            <input type="radio" name="theme" value="light" checked>
                            <span>明るい（白背景）</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="theme" value="dark">
                            <span>暗い（黒背景）</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
                <button id="settings-reset" class="test-btn" style="background-color: rgba(220, 38, 38, 0.06); color: #dc2626; border-color: rgba(220, 38, 38, 0.15);" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon" style="width: 18px; height: 18px;">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                    </svg>
                    デフォルトに戻す
                </button>
                <button id="settings-save" class="save-btn">設定を保存する</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260526_4"></script>
</body>
</html>
