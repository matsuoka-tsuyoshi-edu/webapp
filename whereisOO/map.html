<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Where is OO? - iPad A [Navigator / 地図役]</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- ローカルライブラリ ＆ CDNフォールバック -->
    <script src="js/three.min.js"></script>
    <script>
    if (typeof THREE === 'undefined') {
        document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
    </script>
    <script src="js/peerjs.min.js"></script>
    <script>
    if (typeof Peer === 'undefined') {
        document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
    }
    </script>
    <script src="js/city_gen.js"></script>
    <script src="js/webrtc_sync.js"></script>
    <script src="js/i18n.js"></script>
</head>
<body class="map-page-container">

    <!-- 画面上部 バー -->
    <header class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="icon-btn" title="ロビーに戻る" data-i18n="nav_lobby">🏠 ロビー</a>
            <div id="room-badge" class="room-badge" style="display: none;">
                <span data-i18n="room_label_prefix">🔑 合言葉: </span><span id="room-id-text">----</span>
            </div>
            <div class="status-pill waiting" id="conn-status-pill">
                <span id="conn-dot">🟡</span> <span id="conn-status-text" data-i18n="status_waiting">待機中...</span>
            </div>
        </div>

        <div class="goal-info-badge waiting" id="goal-badge">
            <span id="goal-name-text" data-i18n="badge_waiting_question">❓ 相手の質問待ち...</span>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 0.85rem; font-weight: bold; color: #37474f; display: flex; align-items: center; gap: 4px; cursor: pointer; background: #fff; padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc;">
                <input type="checkbox" id="toggle-player-visible" checked>
                <span data-i18n="label_toggle_player">相手の位置</span>
            </label>
            <button class="lang-toggle-btn" type="button" onclick="I18n.toggleLang()" title="Switch to English (for ALT)">
                🌐 English
            </button>
        </div>
    </header>

    <!-- メイン地図エリア -->
    <main class="map-content-area">
        <!-- 左端固定: 英語フレーズ展開トグルボタン (Help) -->
        <button class="phrase-drawer-toggle" id="btn-toggle-drawer" aria-label="英語フレーズを開く" data-i18n="btn_phrase_help">
            💬 英語フレーズ (Help)
        </button>

        <!-- 左サイド展開ドロワー (通常は隠れていて、ボタンを押すと左からスライド展開) -->
        <aside class="phrase-drawer-panel" id="phrase-drawer">
            <div class="drawer-header">
                <div class="drawer-title" data-i18n="drawer_title">💬 道案内フレーズ</div>
                <button class="drawer-close-btn" id="btn-close-drawer" aria-label="閉じる">✕</button>
            </div>

            <!-- レベル別 & 逆引きタブ -->
            <div class="phrase-level-tabs" id="phrase-tabs">
                <button class="level-tab-btn active" data-tab="level1">⭐ Lv.1</button>
                <button class="level-tab-btn" data-tab="level2">⭐⭐ Lv.2</button>
                <button class="level-tab-btn" data-tab="level3">⭐⭐⭐ Lv.3</button>
                <button class="level-tab-btn" data-tab="search" id="tab-btn-search">🔍 逆引き</button>
            </div>

            <p style="font-size: 0.8rem; color: #555; margin-bottom: 8px; line-height: 1.3;" id="phrase-tab-desc">
                まずは自分で考えて、どうしても思い出せない時に確認しよう！
            </p>

            <div class="drawer-phrase-list" id="drawer-phrase-list">
                <!-- JSで動的に表示 -->
            </div>
        </aside>

        <div id="map-canvas-container">
            <!-- 3Dペア探検隊 ミニステージ (地図と方位磁石の間のスペースに配置: Aさん & Bさんがその場で足踏み) -->
            <div class="companion-3d-stage" id="companion-3d-stage">
                <div class="companion-stage-header">
                    <span class="companion-stage-title" data-i18n="companion_title">👥 ペア探検隊</span>
                    <span class="companion-stage-status" id="companion-stage-status">❓ 質問待ち</span>
                </div>
                <div id="companion-canvas-wrapper" class="companion-canvas-wrapper"></div>
                <div class="companion-stage-speech" id="companion-stage-speech" style="display: none;"></div>

                <!-- ペア探検隊 直下の操作パネル (Go Ahead & リアクションスタンプ) -->
                <div class="companion-stage-controls" id="control-move-panel">
                    <button class="btn-control-go" id="btn-toggle-move" type="button" title="案内が終わったら押して、探検役に『どうぞ！』と伝えよう">
                        🟢 Go ahead! (どうぞ！)
                    </button>
                    <div class="reactions-bar">
                        <button class="btn-reaction" type="button" data-reaction="good" title="いいね！">👍 Good!</button>
                        <button class="btn-reaction" type="button" data-reaction="great" title="すばらしい！">✨ Great!</button>
                        <button class="btn-reaction" type="button" data-reaction="excellent" title="最高！">🌟 Excellent!</button>
                        <button class="btn-reaction" type="button" data-reaction="try_again" title="おしい！もう一回！">🔄 Try again!</button>
                    </div>
                </div>
            </div>

            <canvas id="map-canvas"></canvas>
        </div>
    </main>

    <!-- ゴール達成モーダル -->
    <div class="modal-overlay" id="goal-modal">
        <div class="modal-dialog">
            <div class="goal-celebration-title" data-i18n="goal_modal_title">🎉 GOAL! 🎉</div>
            <p style="font-weight: bold; color: #2e7d32; font-size: 1.15rem;" id="goal-modal-msg-a" data-i18n="goal_modal_msg_a">
                探検役が目的地に到着しました！
            </p>
            <div class="goal-landmark-box">
                <span class="icon" id="modal-goal-icon">🏥</span>
                <div class="name" id="modal-goal-name">Hospital</div>
                <div style="font-size: 0.95rem; color: #616161;" id="modal-goal-jp">病院</div>
            </div>
            <p style="font-size: 1.05rem; color: #333; margin-bottom: 20px;" id="goal-modal-sub" data-i18n="goal_modal_teamwork">
                Great teamwork! 素晴らしい道案内でした！
            </p>
            <button class="btn btn-accent" style="width: 100%; font-size: 1.15rem;" id="btn-wait-next-goal" data-i18n="btn_wait_next_question">
                ⏳ つぎの質問を待つ
            </button>
            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="location.reload()" data-i18n="btn_restart">
                最初からやり直す
            </button>
            <button class="btn btn-blue" style="width: 100%; margin-top: 10px;" onclick="location.href='index.html'" data-i18n="btn_back_lobby">
                ロビーに戻る
            </button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // 多言語初期化
        I18n.init();

        const params = new URLSearchParams(window.location.search);
        const seedParam = params.get('seed') || '01';
        const roomParam = params.get('room') || '';
        const mode = params.get('mode') || (roomParam ? 'webrtc' : 'seed');

        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('map-canvas-container');
        const roomBadge = document.getElementById('room-badge');
        const roomIdText = document.getElementById('room-id-text');
        const connStatusPill = document.getElementById('conn-status-pill');
        const connStatusText = document.getElementById('conn-status-text');
        const connDot = document.getElementById('conn-dot');
        const goalBadge = document.getElementById('goal-badge');
        const goalNameText = document.getElementById('goal-name-text');
        const togglePlayerVisible = document.getElementById('toggle-player-visible');
        const controlMovePanel = document.getElementById('control-move-panel');
        const btnToggleMove = document.getElementById('btn-toggle-move');

        // 3Dペア探検隊 ミニステージDOM
        const companionStage = document.getElementById('companion-3d-stage');
        const companionCanvasWrapper = document.getElementById('companion-canvas-wrapper');
        const companionStageStatus = document.getElementById('companion-stage-status');
        const companionStageSpeech = document.getElementById('companion-stage-speech');

        function setCompanionStageStatus(text, type = 'normal') {
            if (!companionStageStatus) return;
            companionStageStatus.textContent = text;
            if (type === 'go') {
                companionStageStatus.style.background = '#e8f5e9';
                companionStageStatus.style.color = '#2e7d32';
                companionStageStatus.style.borderColor = '#81c784';
            } else if (type === 'wait') {
                companionStageStatus.style.background = '#ffebee';
                companionStageStatus.style.color = '#c62828';
                companionStageStatus.style.borderColor = '#ef9a9a';
            } else if (type === 'goal') {
                companionStageStatus.style.background = '#fff3e0';
                companionStageStatus.style.color = '#e65100';
                companionStageStatus.style.borderColor = '#ffb74d';
            } else {
                companionStageStatus.style.background = '#fff8e1';
                companionStageStatus.style.color = '#f57f17';
                companionStageStatus.style.borderColor = '#ffe082';
            }
        }

        let speechTimer = null;
        function showCompanionSpeech(text, durationMs = 2400) {
            if (!companionStageSpeech) return;
            companionStageSpeech.textContent = text;
            companionStageSpeech.style.display = 'block';
            clearTimeout(speechTimer);
            speechTimer = setTimeout(() => {
                if (companionStageSpeech) companionStageSpeech.style.display = 'none';
            }, durationMs);
        }

        let isMoveAllowed = false; // iPad Bの移動許可フラグ (初期はロック)

        function updateMoveControlButton() {
            if (!btnToggleMove) return;
            const isEn = I18n.getLang() === 'en';
            if (isMoveAllowed) {
                btnToggleMove.className = 'btn-control-wait';
                btnToggleMove.innerHTML = isEn ? '🔴 Wait! (Stop)' : '🔴 Wait! (ストップ！)';
                btnToggleMove.title = isEn ? 'Tap to pause Explorer' : 'タップすると探検役をストップさせます';
                setCompanionStageStatus(isEn ? '🟢 Go ahead! (Moving)' : '🟢 Go ahead! (前進許可)', 'go');
            } else {
                btnToggleMove.className = 'btn-control-go';
                btnToggleMove.innerHTML = isEn ? '🟢 Go ahead! (Proceed)' : '🟢 Go ahead! (どうぞ！)';
                btnToggleMove.title = isEn ? 'Tap when finished giving directions' : '英語の案内が終わったら押して、探検役に『どうぞ！』と伝えよう';
                if (activeGoal) {
                    setCompanionStageStatus(isEn ? `${activeGoal.icon} Guiding to ${activeGoal.landmarkName}` : `${activeGoal.icon} ${activeGoal.landmarkName} へ案内中`, 'normal');
                } else {
                    setCompanionStageStatus(I18n.t('stage_status_waiting'), 'normal');
                }
            }
        }

        if (btnToggleMove) {
            btnToggleMove.addEventListener('click', () => {
                isMoveAllowed = !isMoveAllowed;
                updateMoveControlButton();
                if (isMoveAllowed) {
                    showCompanionSpeech("Let's go! 🟢", 2000);
                } else {
                    showCompanionSpeech('Wait! 🔴', 1800);
                }
                if (rtcSync && rtcSync.isConnected) {
                    rtcSync.send({
                        type: 'CONTROL_MOVE',
                        allowMove: isMoveAllowed
                    });
                }
            });
        }

        // リアクションスタンプ (Good, Great, Excellent, Try again)
        document.querySelectorAll('.btn-reaction').forEach(btn => {
            btn.addEventListener('click', () => {
                const reactionType = btn.getAttribute('data-reaction');
                const text = btn.textContent.trim();
                playReactionSound(reactionType);
                showCompanionSpeech(text, 2200);
                if (rtcSync && rtcSync.isConnected) {
                    rtcSync.send({
                        type: 'REACTION',
                        reaction: reactionType,
                        text: text
                    });
                }
            });
        });

        // お助けフレーズ (レベル別 & 逆引き) データと描画
        const phraseTabs = document.getElementById('phrase-tabs');
        const phraseTabDesc = document.getElementById('phrase-tab-desc');
        const drawerPhraseList = document.getElementById('drawer-phrase-list');

        const PHRASES_DATA = {
            level1: [
                { en: "Go straight.", jp: "まっすぐ進んで", en_sub: "Walk forward", tts: "Go straight." },
                { en: "Turn right.", jp: "右に曲がって", en_sub: "Turn right 90°", tts: "Turn right." },
                { en: "Turn left.", jp: "左に曲がって", en_sub: "Turn left 90°", tts: "Turn left." },
                { en: "Stop.", jp: "止まって", en_sub: "Halt / Wait", tts: "Stop." },
                { en: "Go ahead!", jp: "どうぞ！進んで！", en_sub: "You may proceed!", tts: "Go ahead!" },
                { en: "You're welcome!", jp: "どういたしまして！", en_sub: "No problem / My pleasure", tts: "You are welcome!" }
            ],
            level2: [
                { en: "Go straight for 1 block.", jp: "1ブロックまっすぐ進んで", en_sub: "Walk ahead past 1 block", tts: "Go straight for one block." },
                { en: "Go straight for 2 blocks.", jp: "2ブロックまっすぐ進んで", en_sub: "Walk ahead past 2 blocks", tts: "Go straight for two blocks." },
                { en: "Turn right at the corner.", jp: "角を右に曲がって", en_sub: "Turn right at the intersection", tts: "Turn right at the corner." },
                { en: "Turn left at the corner.", jp: "角を左に曲がって", en_sub: "Turn left at the intersection", tts: "Turn left at the corner." },
                { en: "Turn right at the second corner.", jp: "2つ目の角を右に曲がって", en_sub: "Turn right at the 2nd intersection", tts: "Turn right at the second corner." },
                { en: "It's on your right.", jp: "右手にあるよ", en_sub: "Located on your right side", tts: "It is on your right." },
                { en: "It's on your left.", jp: "左手にあるよ", en_sub: "Located on your left side", tts: "It is on your left." },
                { en: "You can see it!", jp: "見えてきたよ！", en_sub: "It is in view now!", tts: "You can see it!" }
            ],
            level3: [
                { en: "Turn right at the corner of the Post Office.", jp: "郵便局の角を右に曲がって", en_sub: "Turn right at the post office corner", tts: "Turn right at the corner of the Post Office." },
                { en: "Turn left at the corner of the Hospital.", jp: "病院の角を左に曲がって", en_sub: "Turn left at the hospital corner", tts: "Turn left at the corner of the Hospital." },
                { en: "It's next to the Library.", jp: "図書館の隣にあるよ", en_sub: "Beside the library", tts: "It is next to the Library." },
                { en: "It's across from the Park.", jp: "公園の向かい側にあるよ", en_sub: "Directly opposite the park", tts: "It is across from the Park." },
                { en: "It's across the street.", jp: "通りの向かいにあるよ", en_sub: "On the other side of the street", tts: "It is across the street." },
                { en: "It's between the Bank and the Bakery.", jp: "銀行とパン屋の間にあるよ", en_sub: "In the middle of bank & bakery", tts: "It is between the Bank and the Bakery." }
            ],
            search: [
                { qKey: "q1", en: "Turn right / left at the corner.", jp: "角を右／左に曲がって", en_sub: "Turn at the corner", tts: "Turn right at the corner." },
                { qKey: "q2", en: "Turn right at the corner of the ~.", jp: "〜の角を右に曲がって", en_sub: "Turn at the corner of [Landmark]", tts: "Turn right at the corner of the post office." },
                { qKey: "q3", en: "It's next to the ~.", jp: "〜の隣にあるよ", en_sub: "Beside [Landmark]", tts: "It is next to the library." },
                { qKey: "q4", en: "It's across from the ~.", jp: "〜の向かい側だよ", en_sub: "Opposite [Landmark]", tts: "It is across from the park." },
                { qKey: "q5", en: "You passed it! Come back!", jp: "通り過ぎたよ！戻って！", en_sub: "You passed it! Turn back!", tts: "You passed it! Come back!" },
                { qKey: "q6", en: "One more time, please.", jp: "もう1回言ってください", en_sub: "Please repeat once more", tts: "One more time, please." },
                { qKey: "q7", en: "Slowly, please.", jp: "ゆっくりお願いします", en_sub: "Please speak more slowly", tts: "Slowly, please." },
                { qKey: "q8", en: "You're welcome!", jp: "どういたしまして！", en_sub: "You are welcome!", tts: "You are welcome!" }
            ]
        };

        function renderPhrases(tabKey) {
            if (!drawerPhraseList) return;
            drawerPhraseList.innerHTML = '';
            
            const list = PHRASES_DATA[tabKey] || PHRASES_DATA.level1;
            const isEn = I18n.getLang() === 'en';
            
            phraseTabDesc.textContent = I18n.t('tab_desc_' + tabKey);
            const tabBtnSearch = document.getElementById('tab-btn-search');
            if (tabBtnSearch) tabBtnSearch.textContent = isEn ? '🔍 Reverse' : '🔍 逆引き';

            list.forEach(item => {
                const el = document.createElement('div');
                el.className = 'drawer-phrase-item';
                let html = '';
                if (item.qKey) {
                    const qText = I18n.getSearchQuestion(item.qKey);
                    html += `<div style="font-size: 0.82rem; font-weight: bold; color: #e65100; margin-bottom: 2px;">${qText}</div>`;
                }
                const subText = isEn ? (item.en_sub || '') : item.jp;
                html += `
                    <div class="drawer-phrase-top">
                        <span class="drawer-phrase-en">${item.en}</span>
                        <button class="btn-mini-speak" type="button" onclick="speakPhrase('${item.tts.replace(/'/g, "\\'")}')">${I18n.t('btn_listen')}</button>
                    </div>
                    ${subText ? `<span class="drawer-phrase-jp">${subText}</span>` : ''}
                `;
                el.innerHTML = html;
                drawerPhraseList.appendChild(el);
            });
        }

        if (phraseTabs) {
            phraseTabs.querySelectorAll('.level-tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    phraseTabs.querySelectorAll('.level-tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPhrases(btn.getAttribute('data-tab'));
                });
            });
            renderPhrases('level1');
        }

        const goalModal = document.getElementById('goal-modal');
        const modalGoalIcon = document.getElementById('modal-goal-icon');
        const modalGoalName = document.getElementById('modal-goal-name');
        const modalGoalJp = document.getElementById('modal-goal-jp');
        const btnWaitNextGoal = document.getElementById('btn-wait-next-goal');

        // 街データ生成
        const city = CityGen.generateCity(seedParam);
        console.log('City generated on Map:', city);

        let activeGoal = null; // 現在の目的地 (Bから指定される)

        // オフライン・シードモードの場合は初期ゴールを表示
        if (mode !== 'webrtc') {
            activeGoal = city.goal;
            updateGoalDisplay(activeGoal);
        }

        function updateGoalDisplay(goalObj) {
            activeGoal = goalObj;
            goalBadge.className = 'goal-info-badge';
            const isEn = I18n.getLang() === 'en';
            goalNameText.innerHTML = `${I18n.t('badge_goal_prefix')} ${goalObj.icon} <strong>${goalObj.landmarkName}</strong>`;

            modalGoalIcon.textContent = goalObj.icon;
            modalGoalName.textContent = goalObj.landmarkName;
            modalGoalJp.textContent = isEn ? '(Destination)' : goalObj.landmarkJpName;

            // 3Dペア探検隊ステージの更新: Bさんが合流し、目的地への足踏み行進を開始
            if (charA3D && charB3D) {
                charA3D.root.position.set(-0.48, 0.11, 0);
                charB3D.root.position.set(0.48, 0.11, 0);
                charB3D.root.visible = true;
                const statusText = isEn 
                    ? `${goalObj.icon} Guiding to ${goalObj.landmarkName}` 
                    : `${goalObj.icon} ${goalObj.landmarkName} へ案内中`;
                setCompanionStageStatus(statusText, 'normal');
                showCompanionSpeech(`${goalObj.icon} Let's go!`, 2500);
            }

            drawMap();
        }

        // 言語切替時の動的UI再描画
        window.addEventListener('languageChanged', () => {
            updateMoveControlButton();
            if (activeGoal) {
                updateGoalDisplay(activeGoal);
            } else {
                goalNameText.innerHTML = I18n.t('badge_waiting_question');
            }
            if (rtcSync) {
                if (rtcSync.isConnected) {
                    connStatusText.textContent = I18n.t('status_partner_connected');
                } else {
                    connStatusText.textContent = I18n.t('status_waiting_partner');
                }
            }
            const activeTabBtn = phraseTabs ? phraseTabs.querySelector('.level-tab-btn.active') : null;
            const activeTab = activeTabBtn ? activeTabBtn.getAttribute('data-tab') : 'level1';
            renderPhrases(activeTab);
            drawMap();
        });

        // 相手（iPad B）のリアルタイム状態
        let explorerState = {
            worldX: city.spawn.worldX,
            worldZ: city.spawn.worldZ,
            angle: city.spawn.angle,
            active: false
        };

        let showExplorer = true;
        togglePlayerVisible.addEventListener('change', (e) => {
            showExplorer = e.target.checked;
            drawMap();
        });

        // -------------------------------------------------------------
        // WebRTC 通信セットアップ (ホスト役)
        // -------------------------------------------------------------
        let rtcSync = null;

        if (mode === 'webrtc') {
            roomBadge.style.display = 'flex';
            const initialRoomId = roomParam || WebRTCSync.generateNumericId();
            roomIdText.textContent = initialRoomId;

            rtcSync = new WebRTCSync({
                role: 'host',
                roomId: initialRoomId,
                onStatusChange: (status, message) => {
                    console.log('[WebRTC Host Status]', status, message);
                    if (status === 'waiting') {
                        connStatusPill.className = 'status-pill waiting';
                        connDot.textContent = '🟡';
                        connStatusText.textContent = I18n.t('status_waiting_partner');
                        roomIdText.textContent = rtcSync.roomId;
                    } else if (status === 'connected') {
                        connStatusPill.className = 'status-pill connected';
                        connDot.textContent = '🟢';
                        connStatusText.textContent = I18n.t('status_partner_connected');
                        isMoveAllowed = false;
                        updateMoveControlButton();
                        rtcSync.send({
                            type: 'INIT',
                            seed: city.seed
                        });
                        rtcSync.send({
                            type: 'CONTROL_MOVE',
                            allowMove: false
                        });
                    } else if (status === 'disconnected') {
                        connStatusPill.className = 'status-pill waiting';
                        connDot.textContent = '🔴';
                        connStatusText.textContent = I18n.t('status_disconnected');
                    } else if (status === 'offline') {
                        connStatusPill.className = 'status-pill offline';
                        connDot.textContent = '⚪';
                        connStatusText.textContent = I18n.t('status_offline');
                    }
                },
                onConnected: () => {
                    explorerState.active = true;
                },
                onData: (data) => {
                    if (data.type === 'CHOOSE_GOAL') {
                        // iPad Bからランダム目的地が届いた！
                        isGoalCelebrating = false;
                        playChimeSound();
                        const newGoal = city.setGoalById(data.landmarkId);
                        if (newGoal) {
                            updateGoalDisplay(newGoal);
                        } else {
                            updateGoalDisplay({
                                landmarkId: data.landmarkId,
                                landmarkName: data.landmarkName,
                                landmarkJpName: data.landmarkJpName,
                                icon: data.icon,
                                worldX: city.goal.worldX,
                                worldZ: city.goal.worldZ
                            });
                        }
                        // 新しいミッションが始まったら、移動許可をリセット (まずは案内を聞かせる)
                        isMoveAllowed = false;
                        updateMoveControlButton();
                        rtcSync.send({ type: 'CONTROL_MOVE', allowMove: false });
                        // ゴールモーダルが開いていたら閉じる
                        goalModal.classList.remove('active');
                    } else if (data.type === 'MOVE') {
                        explorerState.worldX = data.x;
                        explorerState.worldZ = data.z;
                        explorerState.angle = data.angle;
                        explorerState.active = true;
                        drawMap();
                    } else if (data.type === 'GOAL') {
                        showGoalModal();
                    }
                },
                onError: (err) => {
                    console.warn('[WebRTC Error]', err);
                }
            });

            rtcSync.init();
        } else {
            roomBadge.style.display = 'none';
            connStatusPill.className = 'status-pill offline';
            connDot.textContent = '⚪';
            connStatusText.textContent = `シード共有モード [${seedParam}]`;
        }

        let isGoalCelebrating = false;
        btnWaitNextGoal.addEventListener('click', () => {
            goalModal.classList.remove('active');
            isGoalCelebrating = false;
            isCompanionGoalCelebrating = false;
            goalBadge.className = 'goal-info-badge waiting';
            goalNameText.textContent = '❓ つぎの質問待ち...';
            activeGoal = null;
            isMoveAllowed = false;
            updateMoveControlButton();
            if (charA3D && charB3D) {
                charB3D.root.visible = false;
                charA3D.root.position.set(0, 0.11, 0);
                setCompanionStageStatus('❓ 質問待ち', 'normal');
            }
            drawMap();
        });

        function showGoalModal() {
            isGoalCelebrating = true;
            isCompanionGoalCelebrating = true;
            setCompanionStageStatus('🎉 GOAL!', 'goal');
            showCompanionSpeech('🎉 GOAL!! 🎉', 4500);
            triggerMapConfetti();
            playCelebrationSound();
            // 2.5秒間、3Dステージと地図上で二人がぴょんぴょん飛び跳ねて紙吹雪が舞う様子を楽しんでから、ゴール画面を表示
            setTimeout(() => {
                if (isGoalCelebrating) goalModal.classList.add('active');

        }

        // -------------------------------------------------------------
        // Canvas 2D 描画ロジック
        // -------------------------------------------------------------
        let mapScale = 1.0;
        let mapOffsetX = 0;
        let mapOffsetY = 0;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const w = rect.width;
            const h = rect.height;

            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;

            ctx.resetTransform && ctx.resetTransform();
            ctx.scale(dpr, dpr);

            const padding = 24;
            const availableW = w - padding * 2;
            const availableH = h - padding * 2;
            mapScale = Math.min(availableW / city.worldWidth, availableH / city.worldDepth);

            mapOffsetX = (w - city.worldWidth * mapScale) / 2;
            mapOffsetY = (h - city.worldDepth * mapScale) / 2;

            if (companionRenderer && companionCamera && companionCanvasWrapper) {
                const cw = companionCanvasWrapper.clientWidth || 175;
                const ch = companionCanvasWrapper.clientHeight || 130;
                companionCamera.aspect = cw / ch;
                companionCamera.updateProjectionMatrix();
                companionRenderer.setSize(cw, ch);
            }

            drawMap();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

        function worldToCanvas(wx, wz) {
            return {
                x: mapOffsetX + wx * mapScale,
                y: mapOffsetY + wz * mapScale
            };
        }

        // オフライン用: 地図上の建物をタップして手動で目的地を変更できる機能
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const cellPix = city.cellSize * mapScale;

            city.blocks.forEach(block => {
                if (block.isLandmark && block.landmark && !block.landmark.isPark) {
                    const bx = mapOffsetX + block.startX * cellPix;
                    const bz = mapOffsetY + block.startZ * cellPix;
                    const bw = block.width * cellPix;
                    const bh = block.height * cellPix;

                    if (clickX >= bx && clickX <= bx + bw && clickY >= bz && clickY <= bz + bh) {
                        const newGoal = city.setGoalById(block.landmark.id);
                        if (newGoal) {
                            updateGoalDisplay(newGoal);
                        }
                    }
                }
            });
        });

        function drawMap() {
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            // 背景
            ctx.fillStyle = '#c8e6c9';
            ctx.fillRect(mapOffsetX - 10, mapOffsetY - 10, city.worldWidth * mapScale + 20, city.worldDepth * mapScale + 20);

            // 道路
            ctx.fillStyle = '#455a64';
            const cellPix = city.cellSize * mapScale;

            for (let z = 0; z < city.gridSizeZ; z++) {
                for (let x = 0; x < city.gridSizeX; x++) {
                    const cType = city.grid[z][x];
                    if (cType === city.cellTypes.ROAD || cType === city.cellTypes.INTERSECTION) {
                        const px = mapOffsetX + x * cellPix;
                        const pz = mapOffsetY + z * cellPix;
                        ctx.fillRect(px, pz, cellPix + 0.5, cellPix + 0.5);

                        if (cType === city.cellTypes.ROAD) {
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                            ctx.lineWidth = Math.max(1, cellPix * 0.08);
                            ctx.setLineDash([cellPix * 0.25, cellPix * 0.25]);
                            ctx.beginPath();
                            if (z % 4 === 0) {
                                ctx.moveTo(px, pz + cellPix / 2);
                                ctx.lineTo(px + cellPix, pz + cellPix / 2);
                            } else {
                                ctx.moveTo(px + cellPix / 2, pz);
                                ctx.lineTo(px + cellPix / 2, pz + cellPix);
                            }
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    }
                }
            }

            // 街区・建物
            city.blocks.forEach(block => {
                const bx = mapOffsetX + block.startX * cellPix;
                const bz = mapOffsetY + block.startZ * cellPix;
                const bw = block.width * cellPix;
                const bh = block.height * cellPix;

                if (block.isLandmark && block.landmark) {
                    const lm = block.landmark;
                    const isTarget = activeGoal && (activeGoal.landmarkId === lm.id || activeGoal.id === lm.id);

                    if (lm.isPark) {
                        ctx.fillStyle = '#81c784';
                        ctx.fillRect(bx, bz, bw, bh);
                        ctx.strokeStyle = '#388e3c';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(bx, bz, bw, bh);

                        ctx.font = `${Math.floor(cellPix * 0.6)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🌳', bx + bw * 0.3, bz + bh * 0.3);
                        ctx.fillText('🌳', bx + bw * 0.7, bz + bh * 0.7);
                        ctx.fillText('⛲', bx + bw * 0.5, bz + bh * 0.5);
                    } else {
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.fillRect(bx + 3, bz + 3, bw, bh);

                        ctx.fillStyle = lm.roofColor;
                        ctx.fillRect(bx, bz, bw, bh);

                        // 目的地の場合は枠線を強調
                        if (isTarget) {
                            ctx.strokeStyle = '#e53935';
                            ctx.lineWidth = 4;
                        } else {
                            ctx.strokeStyle = lm.accentColor;
                            ctx.lineWidth = 2.5;
                        }
                        ctx.strokeRect(bx, bz, bw, bh);

                        ctx.font = `${Math.floor(cellPix * 0.8)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(lm.icon, bx + bw / 2, bz + bh * 0.35);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = `bold ${Math.max(9, Math.floor(cellPix * 0.3))}px sans-serif`;
                        ctx.fillText(lm.name, bx + bw / 2, bz + bh * 0.75);
                    }
                } else if (block.building) {
                    const bldg = block.building;
                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    ctx.fillRect(bx + 2, bz + 2, bw, bh);

                    ctx.fillStyle = bldg.colors.wall;
                    ctx.fillRect(bx, bz, bw, bh);

                    ctx.strokeStyle = bldg.colors.roof;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bx, bz, bw, bh);

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    const winSize = Math.max(2, cellPix * 0.15);
                    for (let wx = bx + winSize; wx < bx + bw - winSize; wx += winSize * 2.2) {
                        for (let wy = bz + winSize; wy < bz + bh - winSize; wy += winSize * 2.2) {
                            ctx.fillRect(wx, wy, winSize, winSize);
                        }
                    }
                }
            });

            // スタート地点
            const startP = worldToCanvas(city.spawn.worldX, city.spawn.worldZ);
            ctx.save();
            ctx.translate(startP.x, startP.y);

            ctx.fillStyle = '#4caf50';
            ctx.beginPath();
            ctx.arc(0, 0, cellPix * 0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.rotate((city.spawn.angle * Math.PI) / 180);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -cellPix * 0.35);
            ctx.lineTo(cellPix * 0.2, cellPix * 0.2);
            ctx.lineTo(0, cellPix * 0.05);
            ctx.lineTo(-cellPix * 0.2, cellPix * 0.2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#2e7d32';
            ctx.font = `bold ${Math.max(10, Math.floor(cellPix * 0.28))}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('START', startP.x, startP.y + cellPix * 0.75);

            // 目的地のハイライト (アクティブなゴールがある場合)
            if (activeGoal) {
                const goalP = worldToCanvas(activeGoal.worldX, activeGoal.worldZ);
                const time = Date.now() / 300;
                const pulseRadius = (cellPix * 0.55) + Math.sin(time) * 4;

                ctx.strokeStyle = 'rgba(229, 57, 53, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(goalP.x, goalP.y, Math.max(2, pulseRadius), 0, Math.PI * 2);
                ctx.stroke();

                ctx.font = `${Math.floor(cellPix * 0.8)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🚩', goalP.x, goalP.y + 4);

                ctx.fillStyle = '#d32f2f';
                ctx.font = `900 ${Math.max(11, Math.floor(cellPix * 0.32))}px sans-serif`;
                ctx.fillText(`GOAL: ${activeGoal.landmarkName}`, goalP.x, goalP.y - cellPix * 0.5);
            }

            // 探索役の現在位置と向きを示す単一の方向三角形マーカー (▲)
            if (showExplorer && explorerState.active) {
                const expP = worldToCanvas(explorerState.worldX, explorerState.worldZ);
                drawDirectionalMarker(ctx, expP.x, expP.y, explorerState.angle, cellPix, isGoalCelebrating);
            }

            // 紙吹雪アニメーション
            updateAndDrawMapConfetti(ctx);

            // 方位計
            drawCompass(rect.width - 60, 60, 36);
        }

        function drawCompass(cx, cy, r) {
            ctx.save();
            ctx.translate(cx, cy);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#78909c';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 13px sans-serif';

            ctx.fillStyle = '#d32f2f';
            ctx.fillText('N', 0, -r + 11);

            ctx.fillStyle = '#37474f';
            ctx.fillText('S', 0, r - 11);

            ctx.fillText('E', r - 11, 0);

            ctx.fillText('W', -r + 11, 0);

            ctx.fillStyle = '#d32f2f';
            ctx.beginPath();
            ctx.moveTo(0, -r + 16);
            ctx.lineTo(4, -4);
            ctx.lineTo(-4, -4);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#78909c';
            ctx.beginPath();
            ctx.moveTo(0, r - 16);
            ctx.lineTo(4, 4);
            ctx.lineTo(-4, 4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawDirectionalMarker(ctx, cx, cy, angle, cellPix, isGoalCelebrating) {
            ctx.save();
            ctx.translate(cx, cy);

            let jumpY = 0;
            if (isGoalCelebrating) {
                jumpY = -Math.abs(Math.sin(Date.now() / 320)) * (cellPix * 0.35);
            }
            ctx.translate(0, jumpY);

            // 進行方向の視界コーン (前方の視野)
            ctx.save();
            ctx.rotate((angle * Math.PI) / 180);

            const coneGrad = ctx.createRadialGradient(0, 0, 4, 0, -cellPix * 1.6, cellPix * 1.6);
            coneGrad.addColorStop(0, 'rgba(33, 150, 243, 0.45)');
            coneGrad.addColorStop(1, 'rgba(33, 150, 243, 0)');
            ctx.fillStyle = coneGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, cellPix * 1.6, -Math.PI / 2 - 0.52, -Math.PI / 2 + 0.52);
            ctx.closePath();
            ctx.fill();

            // 台座サークル
            const radius = Math.max(12, cellPix * 0.42);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1565c0';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 進行方向を示す1つのシャープな三角形 (▲)
            ctx.fillStyle = '#1e88e5';
            ctx.beginPath();
            ctx.moveTo(0, -radius * 1.32); // 先端
            ctx.lineTo(radius * 0.72, radius * 0.68); // 右後
            ctx.lineTo(0, radius * 0.22); // くびれ
            ctx.lineTo(-radius * 0.72, radius * 0.68); // 左後
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();

            // 状態バッジ (上部に表示)
            const badgeY = -cellPix * 0.62;
            ctx.font = `bold ${Math.max(10, Math.floor(cellPix * 0.24))}px sans-serif`;
            ctx.textAlign = 'center';
            if (isGoalCelebrating) {
                ctx.fillStyle = '#e65100';
                ctx.fillText('🎉 GOAL!', 0, badgeY);
            } else if (isMoveAllowed) {
                ctx.fillStyle = '#2e7d32';
                ctx.fillText('🟢 Go ahead!', 0, badgeY);
            } else {
                ctx.fillStyle = '#d32f2f';
                ctx.fillText('🔒 Wait', 0, badgeY);
            }

            ctx.restore();
        }

        let mapConfettiParticles = [];
        function triggerMapConfetti() {
            mapConfettiParticles = [];
            const colors = ['#e91e63', '#9c27b0', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'];
            for (let i = 0; i < 70; i++) {
                mapConfettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: -10 - Math.random() * 80,
                    vx: (Math.random() - 0.5) * 3,
                    vy: 2 + Math.random() * 4,
                    size: 4 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * Math.PI,
                    vRot: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function updateAndDrawMapConfetti(ctx) {
            if (mapConfettiParticles.length === 0) return;
            for (let i = 0; i < mapConfettiParticles.length; i++) {
                const p = mapConfettiParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.vRot;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
                ctx.restore();
            }
            mapConfettiParticles = mapConfettiParticles.filter(p => p.y < canvas.height + 20);
        }

        function playReactionSound(type) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                let freqs = [523.25, 659.25];
                if (type === 'great' || type === 'excellent') freqs = [523.25, 659.25, 783.99, 1046.50];
                else if (type === 'try_again') freqs = [440, 392];
                freqs.forEach((f, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, ctx.currentTime + idx * 0.09);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.09);
                    osc.stop(ctx.currentTime + idx * 0.09 + 0.3);
                });
            } catch (e) {}
        }

        function playChimeSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const notes = [659.25, 880.00];
                notes.forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.12);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.38);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.12);
                    osc.stop(ctx.currentTime + i * 0.12 + 0.42);
                });
            } catch (e) {}
        }

        // -------------------------------------------------------------
        // 3D ペア探検隊 ミニステージ (Three.js WebGL)
        // -------------------------------------------------------------
        let companionScene, companionCamera, companionRenderer;
        let charA3D = null;
        let charB3D = null;
        let pedestalGroup = null;
        let companionWalkCycle = 0;
        let isCompanionGoalCelebrating = false;
        let companionCelebrateCycle = 0;

        function createVoxelCharacter(role) {
            const group = new THREE.Group();
            const isGuide = (role === 'guide');

            const skinColor = 0xffd1a4;
            const hairColor = isGuide ? 0x263238 : 0x5d4037;
            const shirtColor = isGuide ? 0x1565c0 : 0x43a047;
            const pantsColor = isGuide ? 0x37474f : 0x1e88e5;
            const capColor = isGuide ? 0x1976d2 : 0xff9800;
            const shoeColor = isGuide ? 0xeeeeee : 0x212121;

            const skinMat = new THREE.MeshLambertMaterial({ color: skinColor });
            const hairMat = new THREE.MeshLambertMaterial({ color: hairColor });
            const shirtMat = new THREE.MeshLambertMaterial({ color: shirtColor });
            const pantsMat = new THREE.MeshLambertMaterial({ color: pantsColor });
            const capMat = new THREE.MeshLambertMaterial({ color: capColor });
            const shoeMat = new THREE.MeshLambertMaterial({ color: shoeColor });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            // 頭部グループ
            const headGroup = new THREE.Group();
            headGroup.position.y = 1.35;

            // 頭
            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.44, 0.44), skinMat);
            headMesh.castShadow = true;
            headGroup.add(headMesh);

            // 髪の毛
            const hairMesh = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.18, 0.46), hairMat);
            hairMesh.position.y = 0.16;
            headGroup.add(hairMesh);

            // 帽子 (つば付き)
            const capCrown = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.16, 0.48), capMat);
            capCrown.position.y = 0.22;
            headGroup.add(capCrown);

            const capVisor = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.05, 0.24), capMat);
            capVisor.position.set(0, 0.16, -0.32);
            headGroup.add(capVisor);

            // 目 (-Z正面)
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.03), eyeMat);
            eyeL.position.set(-0.11, 0.02, -0.23);
            headGroup.add(eyeL);

            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.03), eyeMat);
            eyeR.position.set(0.11, 0.02, -0.23);
            headGroup.add(eyeR);

            group.add(headGroup);

            // 胴体 (シャツ)
            const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.56, 0.26), shirtMat);
            torsoMesh.position.y = 0.85;
            torsoMesh.castShadow = true;
            group.add(torsoMesh);

            if (isGuide) {
                // Aさん (案内役): 白い名札バッジ
                const badge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.02), whiteMat);
                badge.position.set(0, 0.95, -0.14);
                group.add(badge);
            } else {
                // Bさん (探検役): 背中にリュックサック
                const backpackMat = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
                const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.42, 0.16), backpackMat);
                backpack.position.set(0, 0.86, 0.20);
                backpack.castShadow = true;
                group.add(backpack);
            }

            // 脚
            const legW = 0.19;
            const legH = 0.56;
            const legD = 0.22;

            // 左脚
            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.12, 0.56, 0);
            const leftLegGeo = new THREE.BoxGeometry(legW, legH, legD);
            leftLegGeo.translate(0, -legH / 2, 0);
            const leftLegMesh = new THREE.Mesh(leftLegGeo, pantsMat);
            leftLegMesh.castShadow = true;
            leftLegGroup.add(leftLegMesh);

            const shoeLGeo = new THREE.BoxGeometry(legW, 0.12, legD + 0.06);
            shoeLGeo.translate(0, -legH + 0.06, -0.03);
            const shoeL = new THREE.Mesh(shoeLGeo, shoeMat);
            leftLegGroup.add(shoeL);
            group.add(leftLegGroup);

            // 右脚
            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.12, 0.56, 0);
            const rightLegGeo = new THREE.BoxGeometry(legW, legH, legD);
            rightLegGeo.translate(0, -legH / 2, 0);
            const rightLegMesh = new THREE.Mesh(rightLegGeo, pantsMat);
            rightLegMesh.castShadow = true;
            rightLegGroup.add(rightLegMesh);

            const shoeRGeo = new THREE.BoxGeometry(legW, 0.12, legD + 0.06);
            shoeRGeo.translate(0, -legH + 0.06, -0.03);
            const shoeR = new THREE.Mesh(shoeRGeo, shoeMat);
            rightLegGroup.add(shoeR);
            group.add(rightLegGroup);

            // 腕
            const armW = 0.16;
            const armH = 0.52;
            const armD = 0.18;

            // 左腕
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-0.32, 1.08, 0);
            const leftArmGeo = new THREE.BoxGeometry(armW, armH, armD);
            leftArmGeo.translate(0, -armH / 2, 0);
            const leftArmMesh = new THREE.Mesh(leftArmGeo, shirtMat);
            leftArmMesh.castShadow = true;
            leftArmGroup.add(leftArmMesh);

            const handLGeo = new THREE.BoxGeometry(armW * 0.9, 0.14, armD * 0.9);
            handLGeo.translate(0, -armH + 0.07, 0);
            const handL = new THREE.Mesh(handLGeo, skinMat);
            leftArmGroup.add(handL);
            group.add(leftArmGroup);

            // 右腕
            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(0.32, 1.08, 0);
            const rightArmGeo = new THREE.BoxGeometry(armW, armH, armD);
            rightArmGeo.translate(0, -armH / 2, 0);
            const rightArmMesh = new THREE.Mesh(rightArmGeo, shirtMat);
            rightArmMesh.castShadow = true;
            rightArmGroup.add(rightArmMesh);

            const handRGeo = new THREE.BoxGeometry(armW * 0.9, 0.14, armD * 0.9);
            handRGeo.translate(0, -armH + 0.07, 0);
            const handR = new THREE.Mesh(handRGeo, skinMat);
            rightArmGroup.add(handR);

            if (isGuide) {
                // Aさんは右手にバインダー地図を持つ
                const mapMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
                const mapMesh = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.22), mapMat);
                mapMesh.position.set(0.06, -armH + 0.07, -0.06);
                mapMesh.rotation.z = -0.2;
                rightArmGroup.add(mapMesh);
            }
            group.add(rightArmGroup);

            return {
                role,
                root: group,
                headGroup,
                leftLeg: leftLegGroup,
                rightLeg: rightLegGroup,
                leftArm: leftArmGroup,
                rightArm: rightArmGroup
            };
        }

        function initCompanion3D() {
            if (typeof THREE === 'undefined' || !companionCanvasWrapper) return;

            const width = companionCanvasWrapper.clientWidth || 175;
            const height = companionCanvasWrapper.clientHeight || 130;

            companionScene = new THREE.Scene();

            companionCamera = new THREE.PerspectiveCamera(42, width / height, 0.1, 50);
            companionCamera.position.set(0, 1.55, 3.75);
            companionCamera.lookAt(0, 0.88, 0);

            companionRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            companionRenderer.setSize(width, height);
            companionRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            companionRenderer.shadowMap.enabled = true;
            companionCanvasWrapper.appendChild(companionRenderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            companionScene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0x81d4fa, 0x558b2f, 0.45);
            companionScene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.85);
            sunLight.position.set(5, 10, 6);
            sunLight.castShadow = true;
            companionScene.add(sunLight);

            // ステージ円形台座 (Pedestal)
            pedestalGroup = new THREE.Group();

            const pedGeo = new THREE.CylinderGeometry(1.4, 1.5, 0.22, 32);
            const pedMat = new THREE.MeshLambertMaterial({ color: 0x7cb342 });
            const pedMesh = new THREE.Mesh(pedGeo, pedMat);
            pedMesh.position.y = 0;
            pedMesh.receiveShadow = true;
            pedestalGroup.add(pedMesh);

            const rimGeo = new THREE.CylinderGeometry(1.42, 1.52, 0.06, 32);
            const rimMat = new THREE.MeshLambertMaterial({ color: 0x5d4037 });
            const rimMesh = new THREE.Mesh(rimGeo, rimMat);
            rimMesh.position.y = -0.08;
            pedestalGroup.add(rimMesh);

            charA3D = createVoxelCharacter('guide');
            charB3D = createVoxelCharacter('explorer');

            // 初期位置
            if (activeGoal) {
                charA3D.root.position.set(-0.48, 0.11, 0);
                charB3D.root.position.set(0.48, 0.11, 0);
                charB3D.root.visible = true;
                setCompanionStageStatus(`${activeGoal.icon} ${activeGoal.landmarkName} へ案内中`, 'normal');
            } else {
                charA3D.root.position.set(0, 0.11, 0);
                charB3D.root.position.set(0.48, 0.11, 0);
                charB3D.root.visible = false;
                setCompanionStageStatus('❓ 質問待ち', 'normal');
            }

            pedestalGroup.add(charA3D.root);
            pedestalGroup.add(charB3D.root);
            companionScene.add(pedestalGroup);

            animateCompanion3D();
        }

        function animateCompanion3D() {
            if (!companionRenderer) return;

            if (isCompanionGoalCelebrating) {
                companionCelebrateCycle += 0.055;
                const jump = Math.abs(Math.sin(companionCelebrateCycle * 1.8)) * 0.38;
                if (charA3D) charA3D.root.position.y = 0.11 + jump;
                if (charB3D && charB3D.root.visible) charB3D.root.position.y = 0.11 + jump;

                const armWave = Math.sin(companionCelebrateCycle * 3.6) * 0.25;
                if (charA3D) {
                    charA3D.leftArm.rotation.x = -Math.PI * 0.75 + armWave;
                    charA3D.rightArm.rotation.x = -Math.PI * 0.75 - armWave;
                    charA3D.leftLeg.rotation.x = 0;
                    charA3D.rightLeg.rotation.x = 0;
                }
                if (charB3D && charB3D.root.visible) {
                    charB3D.leftArm.rotation.x = -Math.PI * 0.75 + armWave;
                    charB3D.rightArm.rotation.x = -Math.PI * 0.75 - armWave;
                    charB3D.leftLeg.rotation.x = 0;
                    charB3D.rightLeg.rotation.x = 0;
                }
            } else {
                // その場で足踏みアニメーション (手足をリズミカルに振る)
                const stepSpeed = isMoveAllowed ? 0.22 : 0.13;
                const swingAmp = isMoveAllowed ? 0.52 : 0.36;
                companionWalkCycle += stepSpeed;

                if (charA3D) {
                    const swingA = Math.sin(companionWalkCycle) * swingAmp;
                    charA3D.leftLeg.rotation.x = swingA;
                    charA3D.rightLeg.rotation.x = -swingA;
                    charA3D.leftArm.rotation.x = -swingA;
                    charA3D.rightArm.rotation.x = swingA;
                    charA3D.root.position.y = 0.11 + Math.abs(Math.sin(companionWalkCycle * 2)) * 0.05;
                }

                if (charB3D && charB3D.root.visible) {
                    const swingB = Math.sin(companionWalkCycle + 0.35) * swingAmp;
                    charB3D.leftLeg.rotation.x = swingB;
                    charB3D.rightLeg.rotation.x = -swingB;
                    charB3D.leftArm.rotation.x = -swingB;
                    charB3D.rightArm.rotation.x = swingB;
                    charB3D.root.position.y = 0.11 + Math.abs(Math.sin((companionWalkCycle + 0.35) * 2)) * 0.05;
                }
            }

            if (pedestalGroup) {
                pedestalGroup.rotation.y = Math.sin(Date.now() / 3600) * 0.16;
            }

            companionRenderer.render(companionScene, companionCamera);
            requestAnimationFrame(animateCompanion3D);
        }

        function animate() {
            drawMap();
            requestAnimationFrame(animate);
        }

        setTimeout(() => {
            resizeCanvas();
            initCompanion3D();
            requestAnimationFrame(animate);
        }, 100);

        // ドロワー開閉処理 (左サイド Helpful Phrases)
        const btnToggleDrawer = document.getElementById('btn-toggle-drawer');
        const btnCloseDrawer = document.getElementById('btn-close-drawer');
        const phraseDrawer = document.getElementById('phrase-drawer');

        if (btnToggleDrawer && phraseDrawer) {
            btnToggleDrawer.addEventListener('click', (e) => {
                e.stopPropagation();
                phraseDrawer.classList.toggle('open');
            });
        }
        if (btnCloseDrawer && phraseDrawer) {
            btnCloseDrawer.addEventListener('click', (e) => {
                e.stopPropagation();
                phraseDrawer.classList.remove('open');
            });
        }
        // 地図をクリックしたらドロワーを閉じる
        document.addEventListener('click', (e) => {
            if (phraseDrawer && phraseDrawer.classList.contains('open')) {
                if (!phraseDrawer.contains(e.target) && e.target !== btnToggleDrawer) {
                    phraseDrawer.classList.remove('open');
                }
            }
        });

        window.speakPhrase = function (text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US';
                utter.rate = 0.9;
                window.speechSynthesis.speak(utter);
            }
        };

        function playCelebrationSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.12);
                    osc.stop(audioCtx.currentTime + idx * 0.12 + 0.5);
                });
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

    })();
    </script>
