<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>さいきとぅーん V23</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js"></script>
    <style>
        /* --- 全体設定 --- */
        body {
            margin: 0; padding: 0;
            font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", sans-serif;
            background-color: #f0f4c3; color: #333;
            overflow: hidden; touch-action: manipulation;
            width: 100vw; height: 100dvh;
            user-select: none; -webkit-user-select: none;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
        }
        .active { display: flex !important; }

        .key-hint {
            font-size: 0.8rem; color: #fff; background: rgba(0,0,0,0.3);
            padding: 2px 8px; border-radius: 10px; margin-left: 10px; vertical-align: middle;
        }

        /* --- タイトル --- */
        #screen-title { background: #00897b; color: white; align-items: center; justify-content: center; }
        h1 { font-size: 4rem; margin-bottom: 20px; text-shadow: 2px 2px 0 #004d40; cursor: pointer; }
        .load-status { font-size: 1.2rem; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 20px; }
        button.big-btn {
            background: #ffca28; color: #3e2723; border: none; padding: 15px 50px;
            font-size: 2rem; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 0 #bf360c; font-weight: bold; transition: transform 0.1s;
            display: flex; align-items: center; gap: 10px;
        }
        button.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #bf360c; }
        .manual-upload { margin-top: 20px; font-size: 0.9rem; opacity: 0.8; }
        .reset-data { margin-top: 30px; font-size: 0.8rem; color: #b2dfdb; text-decoration: underline; cursor: pointer; }

        /* --- メニュー --- */
        #screen-menu { background: #e0f2f1; flex-direction: row; }
        
        /* 左側：エリア一覧 */
        #menu-left {
            flex: 1; border-right: 2px solid #b2dfdb; padding: 20px; 
            overflow-y: auto; display: flex; flex-direction: column;
        }
        
        /* 右側：ライバル一覧 & スタートボタン (Flexboxで上下分割) */
        #menu-right { 
            flex: 1; padding: 20px; 
            display: flex; flex-direction: column; 
            overflow: hidden; /* 全体はスクロールさせない */
        }

        .menu-header { font-size: 1.5rem; color: #00796b; margin-bottom: 10px; font-weight: bold; border-bottom: 2px solid #00796b; flex-shrink: 0; }
        
        #area-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        .area-btn {
            background: white; border: 2px solid #b2dfdb; border-radius: 10px; padding: 10px;
            cursor: pointer; text-align: center; transition: all 0.2s; min-height: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .area-btn.selected { 
            background: #00897b; color: white; border-color: #004d40; 
            transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;
        }
        .area-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
        .badge { 
            font-size: 1rem; background: #e0e0e0; border-radius: 50%; width: 28px; height: 28px; 
            display: flex; align-items: center; justify-content: center; border: 2px solid #bdbdbd;
        }
        .badge.perfect {
            background: #fff176; border-color: #fbc02d; box-shadow: 0 0 5px #fbc02d; position: relative;
        }
        .badge.perfect::after {
            content: '🏆'; position: absolute; top: -8px; right: -8px; font-size: 0.8rem;
        }

        /* 認定証コーナー */
        #trophy-area {
            background: rgba(255,255,255,0.5); border: 2px dashed #b2dfdb; border-radius: 10px;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px; padding: 5px;
            margin-top: 20px; min-height: 60px; flex-shrink: 0;
        }
        .trophy-icon {
            font-size: 2rem; cursor: pointer; transition: transform 0.2s;
            background: #fff; border-radius: 50%; width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid gold; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .trophy-icon:hover { transform: scale(1.2); }

        /* データ操作ボタン */
        #data-controls {
            display: flex; gap: 10px; margin-bottom: 10px; justify-content: flex-end; flex-shrink: 0;
        }
        .data-btn {
            background: #fff; border: 2px solid #546e7a; color: #546e7a;
            padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;
        }
        .data-btn:hover { background: #eceff1; }
        .data-btn:active { transform: translateY(2px); }

        /* キャラクターリスト (ここだけスクロールさせる) */
        #char-list-container {
            flex: 1; /* 残りのスペースを埋める */
            overflow-y: auto; /* 縦スクロール */
            padding-right: 5px; /* スクロールバーとの隙間 */
            margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .char-card {
            background: white; border: 2px solid #ccc; border-radius: 10px; padding: 10px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; opacity: 0.6; pointer-events: none;
            flex-shrink: 0; /* 潰れないようにする */
        }
        .char-card.unlocked { opacity: 1; pointer-events: auto; border-color: #81d4fa; }
        .char-card.selected { background: #e1f5fe; border-color: #0288d1; box-shadow: 0 0 10px rgba(3,169,244,0.5); }
        .char-icon { width: 50px; height: 50px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .char-info { flex: 1; }
        .char-name { font-size: 1.2rem; font-weight: bold; }
        .char-desc { font-size: 0.8rem; color: #666; }
        #boss-area-btn {
            background: linear-gradient(45deg, #212121, #424242); color: #ffeb3b; border: 3px solid #ffeb3b;
            box-shadow: 0 0 15px #ffeb3b; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* スタートボタンエリア (固定) */
        #start-btn-area {
            flex-shrink: 0; /* 縮ませない */
            display: flex; justify-content: center;
            padding-top: 10px; border-top: 1px dashed #b2dfdb;
        }
        #start-match-btn {
            background: #e91e63; color: white; border: none; padding: 15px 30px;
            font-size: 1.4rem; border-radius: 50px; cursor: pointer; white-space: nowrap;
            box-shadow: 0 4px 0 #ad1457; opacity: 0.5; pointer-events: none; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: transform 0.1s;
        }
        #start-match-btn.ready { opacity: 1; pointer-events: auto; }
        #start-match-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #ad1457; }


        /* --- 設定画面 & 認定証画面 (オーバーレイ) --- */
        #screen-settings, #screen-cert {
            background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 200;
        }
        .settings-box, .cert-box {
            background: white; padding: 30px; border-radius: 20px; width: 80%; max-width: 600px;
            text-align: center; position: relative;
        }
        .settings-title { font-size: 2rem; color: #00897b; margin-bottom: 20px; font-weight: bold; }
        .setting-group { margin-bottom: 30px; }
        .setting-label { font-size: 1.2rem; margin-bottom: 10px; display: block; color: #555; }
        
        .mode-btn {
            display: inline-block; padding: 15px 30px; margin: 0 10px; border: 2px solid #ccc;
            border-radius: 10px; font-size: 1.5rem; cursor: pointer; background: #f5f5f5;
            transition: all 0.2s;
        }
        .mode-btn.active {
            border-color: #00897b; background: #e0f2f1; color: #00897b; font-weight: bold;
            box-shadow: 0 0 10px rgba(0,137,123,0.3);
        }
        .mode-desc { font-size: 0.9rem; color: #888; margin-top: 5px; }

        .close-btn {
            background: #e91e63; color: white; border: none; padding: 10px 30px;
            font-size: 1.2rem; border-radius: 30px; cursor: pointer;
        }

        /* --- 認定証特別デザイン --- */
        .cert-box {
            border: 8px double #ffd700; background: linear-gradient(135deg, #fffde7, #ffffff);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }
        .cert-header { font-size: 2.5rem; color: #bf360c; font-weight: bold; margin-bottom: 10px; font-family: "serif"; }
        .cert-icon { font-size: 5rem; margin: 10px 0; animation: bounce 2s infinite; }
        .cert-name { font-size: 1.8rem; font-weight: bold; margin-bottom: 20px; color: #333; }
        .cert-stats { 
            background: rgba(255,255,255,0.8); border-radius: 10px; padding: 15px; margin: 15px 0;
            border: 2px solid #ffd54f; font-size: 1.2rem; color: #555;
        }
        .cert-stats strong { color: #e65100; font-size: 1.5rem; }
        .cert-text { font-size: 1.3rem; line-height: 1.6; color: #00695c; margin-bottom: 20px; font-weight: bold; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }


        /* --- ゲーム画面 --- */
        #screen-game { background: #333; flex-direction: row; }
        #field-area { flex: 6; background: #e1f5fe; padding: 10px; display: flex; flex-direction: column; }
        #field-header { display: flex; justify-content: space-between; height: 40px; align-items: center; margin-bottom: 5px; }
        #abort-btn { background: #90a4ae; color: white; border: none; padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .score-box { background: rgba(0,0,0,0.1); padding: 5px 15px; border-radius: 20px; font-weight: bold; min-width: 60px; text-align: center; }
        #game-region-name { font-weight: bold; font-size: 1.2rem; color: #00695c; }
        #card-grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start; overflow-y: auto; }
        
        .card { position: relative; height: 60px; background: white; border-radius: 8px; border: 2px solid #ccc; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .card:active { transform: scale(0.98); }
        .card.target-p { border-color: #039be5; box-shadow: 0 0 10px #039be5; transform: scale(1.02); z-index: 5; }
        .card.target-e { border-color: #ff7043; }
        .fill-p { position: absolute; top: 0; left: 0; height: 100%; background: #4fc3f7; width: 0%; transition: width 0.1s; z-index: 1; opacity: 0.6; }
        .fill-e { position: absolute; top: 0; right: 0; height: 100%; background: #ff8a65; width: 0%; transition: width 0.1s; z-index: 1; opacity: 0.6; }
        .card-text { position: relative; z-index: 2; font-weight: bold; font-size: 1.1rem; pointer-events: none; }
        .card.owned-p { background: #0277bd; color: white; border: none; }
        .card.owned-e { background: #d84315; color: white; border: none; }
        .card.owned-p .fill-p, .card.owned-e .fill-e { display: none; }

        #cockpit-area { flex: 4; background: #eceff1; border-left: 5px solid #546e7a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #cockpit-info { text-align: center; margin-bottom: 10px; color: #555; }
        #romaji-box { background: white; border-radius: 5px; padding: 5px 20px; font-family: monospace; font-size: 1.5rem; height: 40px; display: flex; align-items: center; margin-bottom: 10px; white-space: nowrap; }
        .typed { color: #ccc; } .current { color: #e91e63; border-bottom: 2px solid; } .untyped { color: #333; }
        #keyboard { display: flex; flex-direction: column; gap: 4px; transform: scale(0.9); }
        .kb-row { display: flex; justify-content: center; gap: 4px; }
        .key { width: 36px; height: 36px; background: white; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 2px 0 #90a4ae; }
        .key.active { background: #29b6f6; color: white; transform: translateY(2px); box-shadow: none; }

        /* --- 結果 --- */
        #screen-result { background: rgba(255,255,255,0.95); align-items: center; justify-content: center; z-index: 100; }
        #res-msg { font-size: 3rem; margin-bottom: 10px; font-weight: bold; }
        #res-score-detail { font-size: 1.5rem; margin-bottom: 10px; color: #555; }
        #res-speed { font-size: 1.2rem; color: #0277bd; font-weight: bold; margin-bottom: 20px; background: #e1f5fe; padding: 5px 15px; border-radius: 10px; }
        
        #rotate-msg { display: flex; height: 100vh; align-items: center; justify-content: center; background: #333; color: white; }
        @media screen and (orientation: landscape) { #rotate-msg { display: none; } }
        @media screen and (orientation: portrait) { .screen { display: none !important; } }
    </style>
</head>
<body>
    <div id="rotate-msg">iPadを横向きにしてね</div>

    <div id="screen-title" class="screen active">
        <h1 onclick="debugUnlock()">さいきとぅーん V23</h1>
        <div class="load-status" id="load-msg">データを準備中...</div>
        <button class="big-btn" onclick="goToMenu()">
            スタート <span class="key-hint">Enter</span>
        </button>
        <div class="manual-upload">
            <input type="file" id="excel-file" accept=".xlsx" onchange="manualLoadExcel(this)">
        </div>
        <div class="reset-data" onclick="resetSaveData()">セーブデータをリセット</div>
    </div>

    <div id="screen-menu" class="screen">
        <div id="menu-left">
            <div class="menu-header">1. エリアをえらぶ</div>
            <div id="area-list"></div>
            </div>
        
        <div id="menu-right">
            <div id="data-controls">
                <button class="data-btn" onclick="openSettings()">⚙ 設定</button>
                <button class="data-btn" onclick="exportSaveData()">💾 セーブ</button>
                <button class="data-btn" onclick="importSaveData()">📂 ロード</button>
                <input type="file" id="json-loader" style="display:none" accept=".json" onchange="onJsonSelected(this)">
            </div>
            <div class="menu-header">2. ライバルをえらぶ</div>
            
            <div id="char-list-container">
                </div>
            
            <div id="start-btn-area">
                <button id="start-match-btn" onclick="startMatch()">
                    ではじめる！ <span class="key-hint">Enter</span>
                </button>
            </div>
        </div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="settings-box">
            <div class="settings-title">ローマ字のひょうじ設定</div>
            <div class="setting-group">
                <div class="setting-label">どちらのタイプにしますか？</div>
                <div id="mode-hepburn" class="mode-btn active" onclick="setRomajiMode('hepburn')">
                    ヘボン式
                    <div class="mode-desc">例： shi, ji, tsu, fu</div>
                </div>
                <div id="mode-kunrei" class="mode-btn" onclick="setRomajiMode('kunrei')">
                    訓令式
                    <div class="mode-desc">例： si, zi, tu, hu</div>
                </div>
            </div>
            <button class="close-btn" onclick="closeSettings()">とじる</button>
        </div>
    </div>

    <div id="screen-cert" class="screen">
        <div class="cert-box">
            <div class="cert-header">🏆 全エリア制覇 認定証 🏆</div>
            <div id="cert-icon" class="cert-icon"></div>
            <div id="cert-name" class="cert-name"></div>
            <div class="cert-stats">
                あなたの最高記録<br>
                <strong id="cert-speed">0</strong> 文字 / 分
            </div>
            <div id="cert-text" class="cert-text"></div>
            <button class="close-btn" onclick="closeCert()">閉じる</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div id="field-area">
            <div id="field-header">
                <button id="abort-btn" onclick="abortGame()">← メニュー</button>
                <div class="score-box" style="color:#0277bd">あなた: <span id="score-p">0</span></div>
                <div id="game-region-name">エリア</div>
                <div class="score-box" style="color:#d84315">相手: <span id="score-e">0</span></div>
            </div>
            <div id="card-grid"></div>
        </div>
        <div id="cockpit-area">
            <div id="cockpit-info">カードを選んでタイプしよう！</div>
            <div id="romaji-box"></div>
            <div id="keyboard"></div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div id="res-msg">WIN!</div>
        <p id="res-score-detail">結果詳細</p>
        <div id="res-speed">今回の記録：1分間に 0 文字</div>
        <button class="big-btn" onclick="backToMenu()">
            メニューへ <span class="key-hint">Enter</span>
        </button>
    </div>

    <script>
        // --- 辞書データ (動的更新のため let に変更) ---
        let romanMap = {
            'あ':['a'], 'い':['i'], 'う':['u'], 'え':['e'], 'お':['o'],
            'か':['ka'], 'き':['ki'], 'く':['ku'], 'け':['ke'], 'こ':['ko'],
            'さ':['sa'], 'す':['su'], 'せ':['se'], 'そ':['so'],
            'た':['ta'], 'て':['te'], 'と':['to'],
            'な':['na'], 'に':['ni'], 'ぬ':['nu'], 'ね':['ne'], 'の':['no'],
            'は':['ha'], 'ひ':['hi'], 'へ':['he'], 'ほ':['ho'],
            'ま':['ma'], 'み':['mi'], 'む':['mu'], 'め':['me'], 'も':['mo'],
            'や':['ya'], 'ゆ':['yu'], 'よ':['yo'],
            'ら':['ra'], 'り':['ri'], 'る':['ru'], 'れ':['re'], 'ろ':['ro'],
            'わ':['wa'], 'を':['wo'], 'ん':['n','nn'],
            'が':['ga'], 'ぎ':['gi'], 'ぐ':['gu'], 'げ':['ge'], 'ご':['go'],
            'ざ':['za'], 'ず':['zu'], 'ぜ':['ze'], 'ぞ':['zo'],
            'だ':['da'], 'で':['de'], 'ど':['do'],
            'ば':['ba'], 'び':['bi'], 'ぶ':['bu'], 'べ':['be'], 'ぼ':['bo'],
            'ぱ':['pa'], 'ぴ':['pi'], 'ぷ':['pu'], 'ぺ':['pe'], 'ぽ':['po'],
            'ぁ':['la','xa'], 'ぃ':['li','xi'], 'ぅ':['lu','xu'], 'ぇ':['le','xe'], 'ぉ':['lo','xo'],
            'っ':['xtu','ltu'],
            'ゃ':['lya','xya'], 'ゅ':['lyu','xyu'], 'ょ':['lyo','xyo'],
            'きゃ':['kya'], 'きゅ':['kyu'], 'きょ':['kyo'],
            'にゃ':['nya'], 'にゅ':['nyu'], 'にょ':['nyo'],
            'ひゃ':['hya'], 'ひゅ':['hyu'], 'ひょ':['hyo'],
            'みゃ':['mya'], 'みゅ':['myu'], 'みょ':['myo'],
            'りゃ':['rya'], 'りゅ':['ryu'], 'りょ':['ryo'],
            'ぎゃ':['gya'], 'ぎゅ':['gyu'], 'ぎょ':['gyo'],
            'びゃ':['bya'], 'びゅ':['byu'], 'びょ':['byo'],
            'ぴゃ':['pya'], 'ぴゅ':['pyu'], 'ぴょ':['pyo'],
            'ー':['-'],
            // --- 変動部分 (初期値はヘボン式) ---
            'し':['shi','si'], 'ち':['chi','ti'], 'つ':['tsu','tu'], 
            'ふ':['fu','hu'], 'じ':['ji','zi'], 'ぢ':['ji','di','zi'], 'づ':['zu','du'],
            'しゃ':['sha','sya'], 'しゅ':['shu','syu'], 'しょ':['sho','syo'],
            'ちゃ':['cha','tya'], 'ちゅ':['chu','tyu'], 'ちょ':['cho','tyo'],
            'じゃ':['ja','jya','zya'], 'じゅ':['ju','jyu','zyu'], 'じょ':['jo','jyo','zyo'],
            'ぢゃ':['ja','dya'], 'ぢゅ':['ju','dyu'], 'ぢょ':['jo','dyo']
        };

        function setRomajiMode(mode) {
            saveData.romajiMode = mode;
            saveSaveData();
            document.getElementById('mode-hepburn').classList.toggle('active', mode === 'hepburn');
            document.getElementById('mode-kunrei').classList.toggle('active', mode === 'kunrei');
            if (mode === 'hepburn') {
                updateMap(['shi','si'], ['chi','ti'], ['tsu','tu'], ['fu','hu'], ['ji','zi'], ['ja','zya'], ['shu','syu'], ['cha','tya']);
            } else {
                updateMap(['si','shi'], ['ti','chi'], ['tu','tsu'], ['hu','fu'], ['zi','ji'], ['zya','ja'], ['syu','shu'], ['tya','cha']);
            }
        }

        function updateMap(s, t, tu, h, z, j, sh, ch) {
            romanMap['し'] = s; romanMap['ち'] = t; romanMap['つ'] = tu; romanMap['ふ'] = h; romanMap['じ'] = z; 
            romanMap['ぢ'] = [z[0], 'di', z[1]]; 
            const sha = s[0].slice(0,-1)+'a'; const sya = s[1].slice(0,-1)+'ya';
            romanMap['しゃ'] = [sha, sya]; romanMap['しゅ'] = [sha.replace('a','u'), sya.replace('a','u')]; romanMap['しょ'] = [sha.replace('a','o'), sya.replace('a','o')];
            const cha = t[0].slice(0,-1)+'a'; const tya = t[1].slice(0,-1)+'ya';
            romanMap['ちゃ'] = [cha, tya]; romanMap['ちゅ'] = [cha.replace('a','u'), tya.replace('a','u')]; romanMap['ちょ'] = [cha.replace('a','o'), tya.replace('a','o')];
            romanMap['じゃ'] = [...j, 'jya']; romanMap['じゅ'] = [j[0].replace('a','u'), j[1].replace('a','u'), 'jyu']; romanMap['じょ'] = [j[0].replace('a','o'), j[1].replace('a','o'), 'jyo'];
            romanMap['ぢゃ'] = romanMap['じゃ']; romanMap['ぢゅ'] = romanMap['じゅ']; romanMap['ぢょ'] = romanMap['じょ'];
        }

        function openSettings() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-settings').classList.add('active');
            setRomajiMode(saveData.romajiMode || 'hepburn');
        }
        function closeSettings() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

        function parseExcelData(data) {
            const wb = XLSX.read(data, {type: 'array'});
            let newData = {};
            wb.SheetNames.forEach(name => {
                const ws = wb.Sheets[name];
                const json = XLSX.utils.sheet_to_json(ws, {header: 1});
                const words = [];
                for(let i=1; i<json.length; i++) {
                    const r = json[i];
                    if(r[0] && r[1]) words.push({ ja: r[0], kana: r[1] });
                }
                if(words.length>0) newData[name] = words;
            });
            if(Object.keys(newData).length>0) gameData = newData;
        }

        function startMatch() {
            if(!selectedArea || selectedCharIndex === -1) return;
            switchScreen('screen-game');
            const enemy = characters[selectedCharIndex];
            document.getElementById('game-region-name').textContent = `${selectedArea} vs ${enemy.name}`;

            let raw = gameData[selectedArea];
            let playCandidates = [...raw];
            while(playCandidates.length < 10) playCandidates = playCandidates.concat(raw);
            shuffleArray(playCandidates);
            let play = playCandidates.slice(0, 10);

            currentCards = play.map((w, i) => {
                const split = splitKana(w.kana);
                return {
                    id: i, ja: w.ja, kana: w.kana, split: split, patterns: generatePatterns(split),
                    owner: null, pIdx: 0, eIdx: 0, pBuf: ""
                };
            });

            playerTargetId = -1; enemyTargetId = -1; isGameRunning = true;
            matchStartTime = Date.now();
            totalTypedChars = 0;
            
            renderField(); initKeyboard();
            autoSelectTarget(0);

            if(enemyTimer) clearInterval(enemyTimer);
            enemyTimer = setInterval(enemyTurn, enemy.speed);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function abortGame() { isGameRunning = false; clearInterval(enemyTimer); backToMenu(); }

        function splitKana(str) {
            let res = [], i = 0;
            while(i < str.length) {
                let c = str[i], n = str[i+1];
                if(n && 'ぁぃぅぇぉゃゅょ'.includes(n)) { res.push(c+n); i+=2; }
                else { res.push(c); i++; }
            }
            return res;
        }

        function generatePatterns(split) {
            return split.map((char, index) => {
                let basePatterns = [...(romanMap[char] || [])];
                if (char === 'っ' && split[index + 1]) {
                    const nextChar = split[index + 1];
                    const nextRomanList = romanMap[nextChar];
                    if (nextRomanList) {
                        nextRomanList.forEach(roma => {
                            const firstChar = roma[0]; 
                            if (firstChar.match(/[a-z]/) && !basePatterns.includes(firstChar)) {
                                basePatterns.push(firstChar);
                            }
                        });
                    }
                }
                return basePatterns;
            });
        }

        document.addEventListener('keydown', e => {
            if(!isGameRunning || playerTargetId === -1) return;
            const k = e.key.toLowerCase(); if(!/^[a-z\-]$/.test(k)) return;
            const c = currentCards[playerTargetId];
            let validPatterns = c.patterns[c.pIdx];
            if(!validPatterns) return;
            let nb = c.pBuf + k;
            if(validPatterns.some(v => v.startsWith(nb))) {
                c.pBuf = nb;
                totalTypedChars++;
                if(validPatterns.includes(c.pBuf)) {
                    c.pIdx++; c.pBuf = "";
                    if(c.pIdx >= c.split.length) { c.owner = 'p'; autoSelectTarget(); }
                }
                renderField(); updateCockpit(); highlightKey(k);
            }
        });

        function renderField() {
            const g = document.getElementById('card-grid'); g.innerHTML = "";
            let ps=0, es=0;
            currentCards.forEach(c => {
                if(c.owner === 'p') ps++; if(c.owner === 'e') es++;
                const el = document.createElement('div');
                el.className = 'card';
                if(c.owner === 'p') el.classList.add('owned-p');
                if(c.owner === 'e') el.classList.add('owned-e');
                if(playerTargetId === c.id) el.classList.add('target-p');
                if(enemyTargetId === c.id) el.classList.add('target-e');
                el.innerHTML = `<div class="fill-p" style="width:${(c.pIdx/c.split.length)*100}%"></div>
                                <div class="fill-e" style="width:${(c.eIdx/c.split.length)*100}%"></div>
                                <div class="card-text">${c.ja}</div>`;
                el.onclick = () => { if(isGameRunning && !c.owner) { playerTargetId = c.id; c.pBuf=""; renderField(); updateCockpit(); } };
                g.appendChild(el);
            });
            document.getElementById('score-p').textContent = ps;
            document.getElementById('score-e').textContent = es;
            if(ps+es === currentCards.length) endGame(ps, es);
        }

        function updateCockpit() {
            const b = document.getElementById('romaji-box');
            if(playerTargetId === -1) { b.innerHTML = "◀ カードを選んで！"; return; }
            const c = currentCards[playerTargetId];
            let html = "";
            for(let i=0; i<c.pIdx; i++) html += `<span class="typed">${romanMap[c.split[i]][0]}</span>`;
            let valids = c.patterns[c.pIdx];
            let m = valids.find(v=>v.startsWith(c.pBuf));
            if(m) html += `<span class="current">${c.pBuf}</span><span class="untyped">${m.substring(c.pBuf.length)}</span>`;
            else html += `<span class="current">${c.pBuf}</span>`;
            for(let i=c.pIdx+1; i<c.split.length; i++) html += `<span class="untyped">${romanMap[c.split[i]][0]}</span>`;
            b.innerHTML = html;
        }

        function autoSelectTarget(forceIndex = -1) {
            if (!isGameRunning) return;
            if (forceIndex !== -1 && !currentCards[forceIndex].owner) {
                playerTargetId = currentCards[forceIndex].id;
            } else {
                const cands = currentCards.filter(c => c.owner === null);
                if (cands.length > 0) playerTargetId = cands[Math.floor(Math.random() * cands.length)].id;
                else playerTargetId = -1;
            }
            if (playerTargetId !== -1) { currentCards[playerTargetId].pBuf = ""; renderField(); updateCockpit(); }
        }

        function enemyTurn() {
            if(!isGameRunning) return;
            if(enemyTargetId === -1 || currentCards[enemyTargetId].owner) {
                const cands = currentCards.filter(c => !c.owner);
                if(cands.length === 0) return;
                enemyTargetId = cands[Math.floor(Math.random()*cands.length)].id;
            }
            const c = currentCards[enemyTargetId];
            c.eIdx++;
            if(c.eIdx >= c.split.length) {
                c.owner = 'e'; enemyTargetId = -1;
                if(playerTargetId === c.id) autoSelectTarget();
            }
            renderField();
        }

        function endGame(p, e) {
            isGameRunning = false; clearInterval(enemyTimer);
            switchScreen('screen-result');
            const msg = document.getElementById('res-msg');
            const currentChar = characters[selectedCharIndex];
            
            const durationSec = (Date.now() - matchStartTime) / 1000;
            const cpm = Math.round((totalTypedChars / durationSec) * 60);
            document.getElementById('res-speed').textContent = `今回の記録：1分間に ${cpm} 文字`;

            if(p > e) {
                msg.textContent = "勝利！🏆"; msg.style.color = "#00897b";
                
                if(!saveData.badges[selectedArea]) saveData.badges[selectedArea] = [];
                if(!saveData.badges[selectedArea].includes(selectedCharIndex)) {
                    saveData.badges[selectedArea].push(selectedCharIndex);
                    saveData.badges[selectedArea].sort((a,b)=>a-b);
                }

                if (e === 0) {
                    if(!saveData.perfects[selectedArea]) saveData.perfects[selectedArea] = [];
                    if(!saveData.perfects[selectedArea].includes(selectedCharIndex)) {
                        saveData.perfects[selectedArea].push(selectedCharIndex);
                        msg.textContent += " (完封！)";
                    }
                }
                
                // 自己ベスト更新 (勝ったときのみ)
                if(!saveData.bestSpeeds) saveData.bestSpeeds = {};
                const currentBest = saveData.bestSpeeds[selectedCharIndex] || 0;
                if(cpm > currentBest) {
                    saveData.bestSpeeds[selectedCharIndex] = cpm;
                }

                if(selectedCharIndex === saveData.maxClearedLevel) {
                    saveData.maxClearedLevel++; if(saveData.maxClearedLevel > 8) saveData.maxClearedLevel = 8;
                    if(selectedCharIndex < 8) selectedCharIndex++;
                }
                saveSaveData();
            } else {
                msg.textContent = "敗北...👾"; msg.style.color = "#d84315";
            }
            document.getElementById('res-score-detail').textContent = `あなた ${p} - ${e} ${currentChar.name}`;
        }

        function backToMenu() { goToMenu(); }
        function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function initKeyboard() { const kb=document.getElementById('keyboard'); kb.innerHTML=""; ['qwertyuiop','asdfghjkl','zxcvbnm-'].forEach(r=>{ const d=document.createElement('div'); d.className='kb-row'; d.innerHTML=r.split('').map(k=>`<div class="key" id="key-${k}">${k.toUpperCase()}</div>`).join(''); kb.appendChild(d); }); }
        function highlightKey(k) { const el=document.getElementById('key-'+k); if(el){ el.classList.add('active'); setTimeout(()=>el.classList.remove('active'), 100); } }
    </script>
</body>
</html>
