<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>じかんどおりに はこべるか？ ごまだっしゅ！</title>
<style>
    /* 全体の設定 */
    :root {
        --bg-color: #fcf8e3;
        --clock-face: #ffffff;
        --hand-hour: #333;
        --hand-minute: #e74c3c;
        --text-color: #5d4037;
        --accent-color: #ff9800;
        --dash-color: #43a047;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        position: relative;
    }

    /* 左パネル */
    .left-panel {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start; 
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        padding-top: 130px; 
    }

    /* 右パネル（時計） */
    .right-panel {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(255,255,255,0.5);
        border-left: 5px dashed var(--accent-color);
    }

    /* 注文ボード */
    #order-board {
        background: #fff;
        border: 4px solid var(--text-color);
        border-radius: 15px;
        padding: 15px;
        text-align: center;
        width: 85%;
        box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        position: relative;
        z-index: 50;
    }
    
    .order-text {
        font-size: 1.4rem;
        margin: 5px 0;
        line-height: 1.4;
    }
    
    .highlight {
        color: #d32f2f;
        font-weight: bold;
        font-size: 2.0rem;
        display: inline-block;
        background: #ffebee;
        padding: 0 10px;
        border-radius: 5px;
    }

    /* ロボットエリア */
    #robot-container {
        position: relative;
        height: 220px;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        margin-top: 50px; 
    }

    /* 吹き出し */
    .speech-bubble {
        position: absolute;
        left: 50%;
        margin-left: 50px; 
        top: 120px; 
        padding: 5px 10px;
        font-size: 0.85rem;
        min-width: auto;
        max-width: 140px; 
        border-radius: 8px;
        border: 2px solid var(--text-color);
        background: #fff;
        font-weight: bold;
        text-align: left;
        box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        z-index: 20;
    }
    .speech-bubble:after {
        content: '';
        position: absolute;
        left: -8px; 
        top: 50%;
        margin-top: -6px;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-right: 6px solid var(--text-color);
        border-left: none;
    }

    #character-wrapper {
        font-size: 4rem;
        text-align: center;
        line-height: 1;
        transform-origin: center bottom;
        margin-bottom: 5px;
    }

    .delivery-label {
        font-size: 0.9rem;
        background: var(--text-color);
        color: #fff;
        padding: 3px 10px;
        border-radius: 10px;
        margin-top: 5px;
    }

    .stack-emoji {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .stack-emoji span {
        display: block;
        height: 60px; 
        line-height: 60px;
    }

    /* 時計のデザイン */
    #clock-container {
        position: relative;
        width: 420px;
        height: 420px;
        background: var(--clock-face);
        border-radius: 50%;
        border: 12px solid var(--text-color);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        z-index: 10;
    }

    .tick {
        position: absolute;
        width: 2px;
        height: 10px;
        background: #999;
        left: 50%;
        top: 0;
        transform-origin: 50% 210px;
    }
    .tick.long {
        width: 6px;
        height: 20px;
        background: var(--text-color);
    }

    .clock-number {
        position: absolute;
        width: 40px;
        height: 40px;
        text-align: center;
        font-size: 2rem;
        font-weight: bold;
        line-height: 40px;
        color: var(--text-color);
    }

    .hand {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform-origin: bottom center;
        border-radius: 10px;
        z-index: 10;
        cursor: pointer;
    }
    .hour-hand { width: 16px; height: 110px; background: var(--hand-hour); z-index: 11; }
    .minute-hand { width: 10px; height: 160px; background: var(--hand-minute); z-index: 12; }
    .center-dot {
        position: absolute;
        width: 24px;
        height: 24px;
        background: var(--text-color);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 13;
    }

    .btn {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 15px 50px;
        font-size: 2rem;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 6px 0 #e65100;
        margin-top: 30px;
        font-weight: bold;
    }
    .btn:active {
        box-shadow: 0 2px 0 #e65100;
        transform: translateY(4px);
    }

    #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 1.5rem;
        background: rgba(255,255,255,0.9);
        padding: 10px 20px;
        border-radius: 10px;
        z-index: 100;
        border: 2px solid var(--text-color);
    }

    /* オーバーレイ（メニュー・結果画面・賞状） */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 248, 227, 0.98);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        text-align: center;
    }
    
    .hidden { display: none !important; }

    h1 { font-size: 2.2rem; margin-bottom: 10px; color: var(--text-color); line-height: 1.2; }
    .title-dash {
        font-size: 1.4em;
        color: var(--dash-color);
        font-style: italic;
        font-weight: 900;
        text-shadow: 3px 3px 0 #fff;
        display: inline-block;
        transform: skewX(-10deg);
    }

    /* メニューのボタンスタイル */
    .mode-switch {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    .mode-btn {
        background: #ddd;
        border: none;
        padding: 10px 20px;
        font-size: 1.2rem;
        border-radius: 20px;
        cursor: pointer;
        color: #555;
    }
    .mode-btn.active {
        background: var(--text-color);
        color: #fff;
        box-shadow: 0 3px 0 #3e2723;
    }

    .level-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 10px;
    }
    
    .level-btn {
        color: var(--text-color);
        border: none;
        padding: 15px 10px;
        font-size: 1.4rem;
        border-radius: 15px;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        font-weight: bold;
        min-width: 160px;
        position: relative;
    }
    .level-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }
    
    .lvl-1 { background-color: #81D4FA; }
    .lvl-2 { background-color: #F48FB1; }
    .lvl-3 { background-color: #EF5350; color: white; }
    .lvl-4 { background-color: #FFD54F; }

    .level-desc {
        display: block;
        font-size: 0.8rem;
        font-weight: normal;
        margin-top: 5px;
        opacity: 0.9;
    }

    /* 賞状ボタン */
    .award-btn {
        background: linear-gradient(135deg, #FFD700, #FDB931);
        color: #d32f2f;
        border: 4px solid #fff;
        padding: 15px 40px;
        font-size: 1.5rem;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 0 15px #FFD700;
        margin-top: 20px;
        font-weight: 900;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    /* 賞状画面 */
    #cert-frame {
        border: 10px double #FFD700;
        padding: 30px;
        background: #fff;
        border-radius: 20px;
        max-width: 90%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .cert-chars {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
        font-size: 2.5rem;
    }
    .cert-char {
        animation: bounce 1s infinite alternate;
    }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }


    /* アニメーション */
    @keyframes pull-back-dash {
        0% { transform: translateX(0) scale(1); }
        40% { transform: translateX(85vw) scale(0.9); } 
        50% { transform: translateX(85vw) scale(1.1) skewX(-10deg); } 
        100% { transform: translateX(-150vw) skewX(20deg); } 
    }
    .delivering-anim {
        animation: pull-back-dash 3.0s ease-in-out forwards;
    }
    
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        50% { transform: translateX(10px); }
        75% { transform: translateX(-10px); }
        100% { transform: translateX(0); }
    }
    .shake-anim {
        animation: shake 0.4s ease-in-out;
    }

</style>
</head>
<body>

    <div id="hud" class="hidden">
        <span id="label-time">のこりじかん</span>: <span id="timer">60</span><span id="label-sec">びょう</span><br>
        <span id="label-count">はいたつ</span>: <span id="score">0</span><span id="label-unit">けん</span>
    </div>

    <div id="app">
        <div class="left-panel">
            <div id="order-board">
                <div style="font-size:3rem;">📞</div>
                <div class="order-text">
                    <span id="text-hello">もしもし？<br>ごまだしうどん やさんですね？</span>
                </div>
                <div class="order-text">
                    <span id="target-time-disp" class="highlight">3時00分</span>
                    <span id="target-condition-disp" class="highlight">ぴったり</span>
                </div>
                <div class="order-text">
                    <span id="text-please">におねがいします！</span>
                </div>
            </div>
            
            <div id="robot-container">
                <div id="speech-bubble" class="speech-bubble">じこくを セットしてね</div>
                <div id="character-wrapper">🤖</div>
                <div class="delivery-label">はいたついん</div>
            </div>
        </div>

        <div class="right-panel">
            <div id="clock-container">
                <div class="center-dot"></div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
            </div>
            <button class="btn" id="deliver-btn">はいたつ！</button>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1 id="title-logo">じかんどおりに はこべるか？<br><span class="title-dash">ごまだっしゅ！</span></h1>
        
        <div class="mode-switch">
            <button class="mode-btn active" id="btn-hiragana" onclick="game.setMode(true)">ひらがな</button>
            <button class="mode-btn" id="btn-kanji" onclick="game.setMode(false)">漢字</button>
        </div>

        <p id="menu-msg" style="margin-bottom:10px;">レベルを えらんでね</p>
        
        <div class="level-container">
            <button class="level-btn lvl-1" onclick="game.start(1)">
                <span id="crown-1"></span>レベル 1
                <span class="level-desc" id="desc-lv1">〇じ、〇じはん</span>
            </button>
            <button class="level-btn lvl-2" onclick="game.start(2)">
                <span id="crown-2"></span>レベル 2
                <span class="level-desc" id="desc-lv2">〇じ〇ふん</span>
            </button>
            <button class="level-btn lvl-3" onclick="game.start(3)">
                <span id="crown-3"></span>レベル 3
                <span class="level-desc" id="desc-lv3">〇ふん まえ/あと</span>
            </button>
            <button class="level-btn lvl-4" onclick="game.start(4)">
                <span id="crown-4"></span>レベル 4
                <span class="level-desc" id="desc-lv4">〇じ〇ふんの…？</span>
            </button>
        </div>

        <div id="award-area" class="hidden">
            <button class="award-btn" onclick="game.showCertificate()">✨️ すぺしゃる 賞状 ✨️</button>
        </div>
    </div>

    <div id="result-screen" class="overlay hidden">
        <h2 id="res-title">しゅうりょう！</h2>
        <p id="res-count-label">はいたつできた かず</p>
        <p style="font-size: 5rem; color: var(--accent-color); font-weight:bold;"><span id="final-score">0</span> <span id="res-unit">けん</span></p>
        <p id="res-rank-label">あなたのランクは…</p>
        <h2 id="rank-text" style="color: #d32f2f; font-size: 2.5rem;">みならい</h2>
        <button class="btn" onclick="game.toMenu()">メニューへ</button>
    </div>

    <div id="cert-screen" class="overlay hidden">
        <div id="cert-frame">
            <h1 style="color:#FF8F00; margin-bottom:10px;">✨️ しょうじょう ✨️</h1>
            <h2 style="font-size:1.5rem;">あなたは うどんのはいたつ<br>「たつ人」です！</h2>
            <div class="cert-chars" id="cert-char-list">
                </div>
            
            <p style="font-size:1.0rem; margin-bottom:5px;" id="cert-date">
                </p>
            <p style="font-size:1.2rem; color:#555; font-weight:bold;">ごまだしうどん かいはつ きょうかい</p>
        </div>
        <button class="btn" style="margin-top:20px;" onclick="game.closeCertificate()">ありがとう！</button>
    </div>

<script>
const game = {
    score: 0,
    timeLeft: 60,
    timerId: null,
    isPlaying: false,
    correctMinutes: 0, 
    currentMinutes: 180, 
    
    level: 1,
    isHiragana: true,

    // 各レベルのクリア状況（5件以上でtrue）
    levelClearStatus: [false, false, false, false], 

    charList: ['🤖', '🐔', '🐱', '🐶', '🐿️', '🐵', '🦍', '🦊', '🦝', '🐺', '🦁', '🐯', '🐮', '🐷', '🐗', '🐑', '🐘'],
    currentChar: '🤖', 

    elTimer: document.getElementById('timer'),
    elScore: document.getElementById('score'),
    elFinalScore: document.getElementById('final-score'),
    elRankText: document.getElementById('rank-text'),
    elWrapper: document.getElementById('character-wrapper'),
    elBubble: document.getElementById('speech-bubble'),
    elHandHour: document.getElementById('hour-hand'),
    elHandMinute: document.getElementById('minute-hand'),
    
    vibrate: (ms) => { if (navigator.vibrate) navigator.vibrate(ms); },

    init: function() {
        this.createClockFace();
        this.updateClockVisuals();
        this.setupTouchEvents();
        this.setRobotState('normal');
        this.setMode(true);
    },

    setMode: function(isHiragana) {
        this.isHiragana = isHiragana;
        document.getElementById('btn-hiragana').className = isHiragana ? 'mode-btn active' : 'mode-btn';
        document.getElementById('btn-kanji').className = !isHiragana ? 'mode-btn active' : 'mode-btn';
        
        if(isHiragana) {
            document.getElementById('menu-msg').innerText = "レベルを えらんでね";
            document.getElementById('desc-lv1').innerText = "〇じ、〇じはん";
            document.getElementById('desc-lv2').innerText = "〇じ〇ふん";
            document.getElementById('desc-lv3').innerText = "〇ふん まえ/あと";
            document.getElementById('desc-lv4').innerText = "〇じ〇ふんの…？";
        } else {
            document.getElementById('menu-msg').innerText = "レベルを選んでね";
            document.getElementById('desc-lv1').innerText = "〇時、〇時半";
            document.getElementById('desc-lv2').innerText = "〇時〇分";
            document.getElementById('desc-lv3').innerText = "〇分 前/後";
            document.getElementById('desc-lv4').innerText = "〇時〇分の…？";
        }
    },

    createClockFace: function() {
        const container = document.getElementById('clock-container');
        const radius = 210; 
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            if (i % 5 === 0) {
                tick.className = 'tick long';
            } else {
                tick.className = 'tick';
            }
            const deg = i * 6;
            tick.style.transform = `rotate(${deg}deg) translateY(10px)`; 
            container.appendChild(tick);
        }
        const numRadius = 165; 
        for (let i = 1; i <= 12; i++) {
            const num = document.createElement('div');
            num.className = 'clock-number';
            num.innerText = i;
            const angle = (i * 30 - 90) * (Math.PI / 180);
            const x = radius + numRadius * Math.cos(angle) - 20;
            const y = radius + numRadius * Math.sin(angle) - 20;
            num.style.left = x + 'px';
            num.style.top = y + 'px';
            container.appendChild(num);
        }
    },

    start: function(lvl) {
        this.level = lvl;
        this.score = 0;
        this.timeLeft = 60;
        this.isPlaying = true;
        
        this.updateTexts();
        this.updateHUD();
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');

        this.nextOrder();
        
        this.timerId = setInterval(() => {
            this.timeLeft--;
            this.updateHUD();
            if (this.timeLeft <= 0) {
                this.finish();
            }
        }, 1000);
    },

    updateTexts: function() {
        const h = this.isHiragana;
        document.getElementById('label-time').innerText = h ? "のこりじかん" : "残り時間";
        document.getElementById('label-sec').innerText = h ? "びょう" : "秒";
        document.getElementById('label-count').innerText = h ? "はいたつ" : "配達";
        document.getElementById('label-unit').innerText = h ? "けん" : "件";
        document.getElementById('deliver-btn').innerText = h ? "はいたつ！" : "配達！";
        
        document.getElementById('text-hello').innerHTML = h 
            ? "もしもし？<br>ごまだしうどん やさんですね？" 
            : "もしもし？<br>ごまだしうどん屋さんですね？";
        document.getElementById('text-please').innerText = h ? "におねがいします！" : "にお願いします！";
    },

    updateHUD: function() {
        this.elTimer.innerText = this.timeLeft;
        this.elScore.innerText = this.score;
    },

    setRobotState: function(state) {
        this.elWrapper.classList.remove('delivering-anim', 'shake-anim');
        void this.elWrapper.offsetWidth; 
        
        if (state === 'normal') {
            this.elWrapper.innerHTML = this.currentChar; 
            this.elBubble.style.opacity = 1;
            
            let idlePhrases = [];
            if (this.isHiragana) {
                idlePhrases = ["じこくを セットしてね", "きょうも がんばるぞ", "セットを おねがい", "てんきは いかが？", "あんぜん うんてん！", "うどん だいすき", "はらぺこ だなぁ", "みち、わかるかな？"];
            } else {
                idlePhrases = ["時刻をセットしてね", "今日もがんばるぞ", "セットをお願い", "天気はいかが？", "安全運転！", "うどん大好き", "腹ペコだなぁ", "道、わかるかな？"];
            }
            this.elBubble.innerText = idlePhrases[Math.floor(Math.random() * idlePhrases.length)];
            
        } else if (state === 'delivering') {
            this.elWrapper.innerHTML = `
                <div class="stack-emoji">
                    <span>🍜</span>
                    <span style="z-index:2;">${this.currentChar}</span>
                    <span style="margin-top:-20px; z-index:1;">🛵</span>
                </div>`;
            
            let phrases = [];
            if(this.isHiragana) {
                phrases = ["いってきまーす！", "でまえ いっちょう！", "へい おまち！", "うどん いきまーす！", "いそげー！！"];
            } else {
                phrases = ["行ってきまーす！", "出前一丁！", "へいお待ち！", "うどん行きまーす！", "急げー！！"];
            }
            this.elBubble.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            
            this.elWrapper.classList.add('delivering-anim');
        } else if (state === 'wrong') {
            this.elWrapper.innerHTML = this.currentChar;
            this.elWrapper.classList.add('shake-anim');
            let phrases = [];
            if(this.isHiragana) {
                phrases = ["ちがうよ〜", "あれれ？", "まだかな？"];
            } else {
                phrases = ["違うよ〜", "あれれ？", "まだかな？"];
            }
            this.elBubble.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        }
    },

    nextOrder: function() {
        this.currentChar = this.charList[Math.floor(Math.random() * this.charList.length)];
        this.setRobotState('normal');

        let targetH = Math.floor(Math.random() * 12) + 1; 
        let targetM = 0;
        let cond = { type: 'exact', text: '', diff: 0 };
        
        const strJi = this.isHiragana ? "じ" : "時";
        const strFun = this.isHiragana ? "ふん" : "分";
        const strHan = this.isHiragana ? "はん" : "半";
        const strMae = this.isHiragana ? "まえ" : "前";
        const strAto = this.isHiragana ? "あと" : "後";
        const strPITTARI = this.isHiragana ? "ぴったり" : "ぴったり";

        if (this.level === 1) {
            targetM = Math.random() < 0.5 ? 0 : 30;
            let timeDisp = "";
            if (targetM === 30) {
                 timeDisp = `${targetH}${strJi}${strHan}`;
            } else {
                 timeDisp = `${targetH}${strJi}00${strFun}`;
            }
            cond = { type: 'exact', text: strPITTARI, diff: 0 };
            document.getElementById('target-time-disp').innerText = timeDisp;
        
        } else if (this.level === 2) {
            targetM = Math.floor(Math.random() * 12) * 5; 
            let timeDisp = `${targetH}${strJi}${targetM.toString().padStart(2, '0')}${strFun}`;
            cond = { type: 'exact', text: strPITTARI, diff: 0 };
            document.getElementById('target-time-disp').innerText = timeDisp;

        } else if (this.level === 3) {
            targetM = 0; 
            let diffs = [-30, -20, -15, -10, -5, 5, 10, 15, 20, 30];
            let d = diffs[Math.floor(Math.random() * diffs.length)];
            let dAbs = Math.abs(d);
            let dText = d < 0 ? `${dAbs}${strFun}${strMae}` : `${dAbs}${strFun}${strAto}`;
            
            cond = { type: 'relative', text: dText, diff: d };
            document.getElementById('target-time-disp').innerText = `${targetH}${strJi}`;
            
        } else if (this.level === 4) {
            targetM = Math.floor(Math.random() * 12) * 5; 
            let diffs = [-15, -10, -5, 5, 10, 15];
            let d = diffs[Math.floor(Math.random() * diffs.length)];
            let dAbs = Math.abs(d);
            let dText = d < 0 ? `${dAbs}${strFun}${strMae}` : `${dAbs}${strFun}${strAto}`;
            
            cond = { type: 'relative', text: dText, diff: d };
            document.getElementById('target-time-disp').innerText = `${targetH}${strJi}${targetM.toString().padStart(2, '0')}${strFun}`;
        }

        document.getElementById('target-condition-disp').innerText = `の ${cond.text}`;

        let baseMinutes = (targetH % 12) * 60 + targetM;
        let correct = baseMinutes + cond.diff;
        if (correct < 0) correct += 720;
        if (correct >= 720) correct -= 720;
        this.correctMinutes = correct;
    },

    checkDelivery: function() {
        if (!this.isPlaying) return;

        let diff = Math.abs(this.currentMinutes - this.correctMinutes);
        if (diff > 360) diff = 720 - diff;

        if (diff <= 2) { 
            this.score++;
            this.vibrate(100);
            this.setRobotState('delivering');
            
            setTimeout(() => {
                this.nextOrder();
            }, 3000);
        } else {
            this.vibrate([50, 50, 50]);
            this.setRobotState('wrong');
            const board = document.getElementById('order-board');
            board.style.backgroundColor = '#ffcdd2';
            setTimeout(() => {
                board.style.backgroundColor = '#fff';
            }, 500);
        }
        this.updateHUD();
    },

    finish: function() {
        this.isPlaying = false;
        clearInterval(this.timerId);
        this.elFinalScore.innerText = this.score;
        
        const h = this.isHiragana;
        document.getElementById('res-title').innerText = h ? "しゅうりょう！" : "終了！";
        document.getElementById('res-count-label').innerText = h ? "はいたつできた かず" : "配達できた数";
        document.getElementById('res-unit').innerText = h ? "けん" : "件";
        document.getElementById('res-rank-label').innerText = h ? "あなたのランクは…" : "あなたのランクは…";

        let rank = "";
        if (this.score <= 1) {
            rank = h ? "みならい" : "見習い";
        } else if (this.score == 2) {
            rank = h ? "はたらきもの" : "働き者";
        } else if (this.score == 3) {
            rank = h ? "リーダー" : "リーダー";
        } else if (this.score == 4) {
            rank = h ? "てんちょう" : "店長";
        } else if (this.score == 5) {
            rank = h ? "たつ人" : "達人";
            // たつ人でクリア
            this.levelClearStatus[this.level - 1] = true;
        } else {
            // 6件以上
            rank = h ? "せん人" : "せん人"; 
            // せん人でもクリア
            this.levelClearStatus[this.level - 1] = true;
        }
        
        this.elRankText.innerText = rank;
        document.getElementById('result-screen').classList.remove('hidden');
    },

    toMenu: function() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        this.updateMenuCrowns();
    },

    updateMenuCrowns: function() {
        let allClear = true;
        for (let i = 0; i < 4; i++) {
            const crownSpan = document.getElementById(`crown-${i+1}`);
            if (this.levelClearStatus[i]) {
                crownSpan.innerText = "👑 ";
            } else {
                crownSpan.innerText = "";
                allClear = false;
            }
        }
        
        if (allClear) {
            document.getElementById('award-area').classList.remove('hidden');
        }
    },

    showCertificate: function() {
        const h = this.isHiragana;
        const container = document.getElementById('cert-char-list');
        container.innerHTML = "";
        
        this.charList.forEach((char, index) => {
            const span = document.createElement('span');
            span.innerText = char;
            span.className = "cert-char";
            span.style.animationDelay = `${index * 0.1}s`;
            container.appendChild(span);
        });

        // 日付生成
        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const hour = now.getHours();
        const min = now.getMinutes().toString().padStart(2, '0');
        
        const dateStr = `${month}月${date}日 ${hour}時${min}分 はっこう`;
        document.getElementById('cert-date').innerText = dateStr;
        
        document.getElementById('cert-screen').classList.remove('hidden');
    },

    closeCertificate: function() {
        document.getElementById('cert-screen').classList.add('hidden');
    },

    updateClockVisuals: function() {
        const mAngle = this.currentMinutes * 6;
        const hAngle = this.currentMinutes * 0.5;
        this.elHandMinute.style.transform = `translate(-50%, 0) rotate(${mAngle}deg)`;
        this.elHandHour.style.transform = `translate(-50%, 0) rotate(${hAngle}deg)`;
    },

    setupTouchEvents: function() {
        const container = document.getElementById('clock-container');
        
        const handleMove = (e) => {
            if (!this.isPlaying) return;
            e.preventDefault();

            const touch = e.touches ? e.touches[0] : e;
            const rect = container.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const x = touch.clientX - cx;
            const y = touch.clientY - cy;

            let rad = Math.atan2(y, x);
            let deg = rad * (180 / Math.PI) + 90;
            if (deg < 0) deg += 360;

            let minutes = Math.round(deg / 6); 
            if (minutes === 60) minutes = 0;

            let currentM = this.currentMinutes % 60;
            let diff = minutes - currentM;
            if (diff < -30) diff += 60; 
            if (diff > 30) diff -= 60; 

            this.currentMinutes += diff;
            if (this.currentMinutes < 0) this.currentMinutes += 720;
            if (this.currentMinutes >= 720) this.currentMinutes -= 720;

            this.updateClockVisuals();
        };

        container.addEventListener('touchmove', handleMove, { passive: false });
        container.addEventListener('mousedown', (e) => {
            container.addEventListener('mousemove', handleMove);
        });
        document.addEventListener('mouseup', () => {
            container.removeEventListener('mousemove', handleMove);
        });
    }
};

document.getElementById('deliver-btn').addEventListener('click', () => {
    game.checkDelivery();
});

game.init();

</script>
